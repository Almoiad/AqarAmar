        function copyShareURL(btn, url) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => {
                    const old = btn.innerHTML;
                    btn.innerHTML = '✓ تم النسخ';
                    btn.style.background = '#1f6b5e';
                    setTimeout(() => {
                        btn.innerHTML = old;
                        btn.style.background = '';
                    }, 1500);
                }).catch(() => fallbackCopy(url, btn));
            } else {
                fallbackCopy(url, btn);
            }
        }
        function fallbackCopy(text, btn) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); btn.innerHTML = '✓ تم النسخ'; } catch (e) {}
            document.body.removeChild(ta);
        }

        // بدء التهيئة
        initMap();
        setupSwipeToClose();

        function showWarn(msg, duration = 8000) {
            const el = document.createElement('div');
            el.className = 'warn';
            el.textContent = msg;
            document.getElementById('map').appendChild(el);
            if (duration > 0) setTimeout(() => el.remove(), duration);
        }

        /* ═══════ تنسيق حدود الأحياء (Google Maps Data API) ═══════ */
        let selectedDistrictId = null;
        let hoveredDistrictId = null;

        function styleDistrictFeature(feature) {
            const zoom = map?.getZoom() ?? 12;
            const id = feature.getId();
            const isSelected = id === selectedDistrictId;
            const isHovered  = id === hoveredDistrictId;
            const isActive   = activeTab === 'districts';

            // الزوم القريب: أخفِ الأحياء عدا الحي المختار (يبقى كخط حدود فقط)
            if (zoom >= 15) {
                if (isSelected) {
                    return {
                        strokeColor: '#2c8c7c', strokeOpacity: 0.85, strokeWeight: 2.5,
                        fillColor: '#2c8c7c', fillOpacity: 0,
                        clickable: false, // اترك النقر يمر للقطع أسفله
                        visible: true,
                    };
                }
                return { visible: false, clickable: false };
            }

            if (isSelected) {
                return {
                    strokeColor: '#2c8c7c', strokeOpacity: 1, strokeWeight: 3,
                    fillColor: '#2c8c7c', fillOpacity: 0.25,
                    clickable: true, visible: true,
                };
            }
            if (isHovered) {
                return {
                    strokeColor: '#2c8c7c', strokeOpacity: 1, strokeWeight: 2.5,
                    fillColor: '#2c8c7c', fillOpacity: 0.18,
                    clickable: true, visible: true,
                };
            }
            return {
                strokeColor: '#2c8c7c',
                strokeOpacity: isActive ? 0.85 : 0.55,
                strokeWeight: isActive ? 1.5 : 1,
                fillColor: '#2c8c7c',
                fillOpacity: isActive ? 0.07 : 0.03,
                clickable: true, visible: true,
            };
        }

        /* ═══════ تأثير المرور بالماوس ═══════ */
        function onDistrictHover(event) {
            // لا تُطبّق تأثير الـ hover عند الزوم القريب (الأحياء مخفية)
            if (map.getZoom() >= 15) return;
            // لا تُطبّق الـ hover عند تفعيل خريطة تفاعلية (تحترم ألوانها)
            if (activeThematicKey) {
                document.getElementById('map').style.cursor = 'pointer';
                return;
            }

            const id = event.feature.getId();
            if (hoveredDistrictId !== id) {
                hoveredDistrictId = id;
                map.data.overrideStyle(event.feature, styleDistrictFeature(event.feature));
                map.data.forEach(f => {
                    if (f !== event.feature && f.getId() !== selectedDistrictId) {
                        map.data.revertStyle(f);
                    }
                });
            }
            document.getElementById('map').style.cursor = 'pointer';
        }
        function onDistrictHoverEnd(event) {
            // عند الخريطة التفاعلية، لا نمس الأنماط
            if (activeThematicKey) {
                document.getElementById('map').style.cursor = '';
                return;
            }
            hoveredDistrictId = null;
            map.data.revertStyle();
            // إعادة رسم الحي المختار
            if (selectedDistrictId) {
                map.data.forEach(f => {
                    if (f.getId() === selectedDistrictId) {
                        map.data.overrideStyle(f, styleDistrictFeature(f));
                    }
                });
            }
            document.getElementById('map').style.cursor = '';
        }

        /* ═══════ زوم شامل على حي ═══════ */
        function zoomToDistrictFeature(feature) {
            if (!feature || !map) return;
            const rings = extractAllRings(feature.getGeometry());
            if (rings.length === 0) return;
            const b = new google.maps.LatLngBounds();
            rings.forEach(ring => ring.forEach(([lng, lat]) => b.extend({ lat, lng })));
            map.fitBounds(b, { top: 40, right: 40, bottom: 40, left: 40 });
            // حدّ أقصى للزوم بعد fitBounds — بدون حركة واضحة لأن fitBounds نفسه
            // يضع الزوم النهائي قبل أن ترى العين أي حركة
            google.maps.event.addListenerOnce(map, 'bounds_changed', () => {
                if (map.getZoom() > 14) map.setZoom(14);
            });
        }

        /* ═══════ نقر على حي ═══════ */
        async function onDistrictClick(event) {
            lastFeatureClick = Date.now();
            const feature = event.feature;
            if (!feature) return;

            // نظّف كل الـ overrides القديمة تماماً ثم طبّق النمط من جديد
            selectedDistrictId = feature.getId();
            hoveredDistrictId = null;
            map.data.revertStyle();
            // احتفظ بألوان الخريطة التفاعلية إن كانت نشطة
            if (activeThematicKey) {
                renderThematicMap();
            } else {
                map.data.setStyle(styleDistrictFeature);
            }

            // زوم شامل على الحي
            zoomToDistrictFeature(feature);

            // استخراج اسم الحي من خصائص OSM
            const nameAr = feature.getProperty('name:ar') ||
                           feature.getProperty('name') ||
                           'الحي المحدد';
            const nameEn = feature.getProperty('name:en') || '';
            const placeType = feature.getProperty('place') ||
                              feature.getProperty('boundary') || '';

            const header = document.getElementById('sidebar-header');
            header.classList.remove('empty');
            document.getElementById('sb-title').textContent = nameAr;
            document.getElementById('sb-subtitle').textContent =
                [nameEn, placeType === 'suburb' ? 'حي' : placeType].filter(Boolean).join(' — ') || 'حي';
            document.getElementById('sb-source').style.display = 'none';

            lastData = {
                ...(lastData || {}),
                district: {
                    name: nameAr,
                    nameEn: nameEn,
                    id: feature.getId(),
                    source: 'osm'
                }
            };
            // نظّف القطعة السابقة (نحن الآن على حي)
            delete lastData.selected;
            delete lastData.results;
            // حدّث URL
            updateURL({
                city: lastData.selectedCity || getCurrentMapCity(),
                district: nameAr,
                thematic: activeThematicKey,
            });
            // إذا كنا في تبويب الأحياء أصلاً، تجنّب switchTab
            if (activeTab === 'districts') {
                renderDistrictTab(lastData);
                expandMobilePanel(nameAr);
            } else {
                switchTab('districts');
            }
        }

        /* ═══════ نقر عام على الخريطة — سلوك ذكي حسب الزوم ═══════ */
        function onMapClick(e) {
            // إذا تم النقر على حد حي للتو، تجاهل
            if (Date.now() - lastFeatureClick < 150) return;

            const zoom = map.getZoom();
            const latLng = e.latLng;

            // زوم بعيد (< 15): ابحث عن حي تحت النقرة
            if (zoom < 15) {
                const feature = findDistrictUnder(latLng);
                if (feature) {
                    onDistrictClick({ feature });
                    return;
                }
                // ما في حي تحت النقرة في الزوم البعيد — لا شيء
                showWarn('اقترب بالزوم لرؤية تفاصيل القطعة، أو انقر على حدود حي', 3000);
                return;
            }

            // زوم قريب (≥ 15): اجلب القطعة
            fetchParcel(latLng.lat(), latLng.lng());
        }

        /* ═══════ إيجاد الحي الذي يحتوي نقطة ═══════ */
        function findDistrictUnder(latLng) {
            const pt = [latLng.lng(), latLng.lat()];
            let found = null;
            map.data.forEach(feature => {
                if (found) return;
                const geom = feature.getGeometry();
                if (pointInDataGeometry(pt, geom)) found = feature;
            });
            return found;
        }

        function pointInDataGeometry(pt, geom) {
            if (!geom) return false;
            const type = geom.getType();
            if (type === 'Polygon') {
                return isPointInPolygon(pt, ringsFromPolygon(geom));
            }
            if (type === 'MultiPolygon') {
                const polys = geom.getArray();
                for (const p of polys) {
                    if (isPointInPolygon(pt, ringsFromPolygon(p))) return true;
                }
            }
            return false;
        }

        function ringsFromPolygon(polyGeom) {
            const rings = [];
            polyGeom.getArray().forEach(linearRing => {
                const ring = [];
                linearRing.getArray().forEach(ll => ring.push([ll.lng(), ll.lat()]));
                rings.push(ring);
            });
            return rings;
        }

        /* ═══════ جلب بيانات القطعة ═══════ */
        async function fetchParcel(lat, lng) {
            // انتقل فوراً إلى تبويب الأراضي
            if (activeTab !== 'lands') {
                activeTab = 'lands';
                document.querySelectorAll('.tab').forEach(t =>
                    t.classList.toggle('active',
                        t.dataset.tab === 'lands' || t.dataset.mtab === 'lands'));
                document.querySelectorAll('.tab-content').forEach(c =>
                    c.classList.toggle('active', c.id === 'tab-lands'));
                updateZoomBadge();
            }
            // وسّع اللوحة على الجوال
            expandMobilePanel('قطعة أرض');

            const header = document.getElementById('sidebar-header');
            header.classList.remove('empty');
            document.getElementById('sb-title').textContent = 'جارٍ التحميل...';
            document.getElementById('sb-subtitle').textContent =
                `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            document.getElementById('sb-source').style.display = 'none';
            document.getElementById('tab-lands').innerHTML =
                '<div class="status loading"><div class="spinner"></div>جارٍ جلب البيانات...</div>';

            if (currentMarker) currentMarker.setMap(null);
            currentMarker = new google.maps.Marker({
                position: { lat, lng }, map,
                icon: { path: google.maps.SymbolPath.CIRCLE, scale: 6,
                        fillColor: '#2c8c7c', fillOpacity: 1,
                        strokeColor: '#fff', strokeWeight: 2 }
            });

            try {
                const ctl = new AbortController();
                const tid = setTimeout(() => ctl.abort(), 20000);
                const res = await fetch(`${PROXY_URL}/identify?lat=${lat}&lng=${lng}`,
                                        { signal: ctl.signal });
                clearTimeout(tid);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (data.error) throw new Error(typeof data.error === 'string' ? data.error : JSON.stringify(data.error));

                if (data._source) {
                    const badge = document.getElementById('sb-source');
                    badge.textContent = 'مصدر: وزارة البلديات والإسكان';
                    badge.title = `واجهة بلدي (${data._source})`;
                    badge.style.display = 'inline-block';
                }

                if (data.results && data.results.length > 0) {
                    const selected = selectBestResult(data.results, lat, lng);
                    lastData = { ...(lastData || {}), results: data.results, selected, lat, lng };
                    // نظّف اختيارات المدينة/الحي السابقة — القطعة مستقلة
                    delete lastData.selectedCity;
                    delete lastData.district;
                    selectedDistrictId = null;
                    renderLandsTab(selected);
                    drawPolygon(selected);
                    // حدّث URL — شارك رقم الهوية العقارية فقط
                    const parcelId = selected?.attributes?.RE_PARCELID;
                    if (parcelId) {
                        updateURL({ city: null, district: null, parcel: parcelId, thematic: null });
                    }
                } else {
                    document.getElementById('sb-title').textContent = 'لا توجد بيانات';
                    document.getElementById('tab-lands').innerHTML = emptyTab('❓', 'لم يتم العثور على قطعة');
                }
            } catch (err) {
                document.getElementById('sb-title').textContent = 'تعذر جلب البيانات';
                document.getElementById('tab-lands').innerHTML = `
                    <div class="status error">
                        <div style="font-size:32px;margin-bottom:8px">⚠️</div>
                        <div style="font-size:12px;direction:ltr">${escapeHtml(err.message)}</div>
                    </div>`;
            }
        }

        /* ═══════ اختيار الأنسب ═══════ */
        function selectBestResult(results, lat, lng) {
            const withGeom = results.filter(r => r.geometry && r.geometry.rings);
            const parcels = withGeom.filter(r => /parcel|قطعة/i.test(r.layerName || ''));
            const pool = parcels.length ? parcels : withGeom;
            const containing = pool.filter(r => isPointInPolygon([lng, lat], r.geometry.rings));
            if (containing.length > 0) {
                return containing.sort((a, b) => polygonArea(a.geometry.rings) - polygonArea(b.geometry.rings))[0];
            }
            if (pool.length > 0) {
                return pool.sort((a, b) =>
                    distanceToCentroid([lng, lat], a.geometry.rings) -
                    distanceToCentroid([lng, lat], b.geometry.rings)
                )[0];
            }
            return results[0];
        }
        function isPointInPolygon(pt, rings) {
            let inside = false;
            for (const ring of rings) {
                for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                    const [xi, yi] = ring[i], [xj, yj] = ring[j];
                    const intersect = ((yi > pt[1]) !== (yj > pt[1])) &&
                                      (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi);
                    if (intersect) inside = !inside;
                }
            }
            return inside;
        }
        function polygonArea(rings) {
            let area = 0;
            for (const ring of rings) {
                for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                    area += (ring[j][0] + ring[i][0]) * (ring[j][1] - ring[i][1]);
                }
            }
            return Math.abs(area / 2);
        }
        function distanceToCentroid(pt, rings) {
            const ring = rings[0];
            const cx = ring.reduce((s, p) => s + p[0], 0) / ring.length;
            const cy = ring.reduce((s, p) => s + p[1], 0) / ring.length;
            return Math.hypot(pt[0] - cx, pt[1] - cy);
        }

        /* ═══════ القطع المحفوظة (localStorage + نجمات على الخريطة) ═══════ */
        const MAX_SAVED = 10;
        let savedMarkers = [];

        function getSaved() {
            try { return JSON.parse(localStorage.getItem('savedParcels') || '[]'); }
            catch { return []; }
        }
        function setSaved(arr) {
            localStorage.setItem('savedParcels', JSON.stringify(arr));
            renderSavedMarkers();
        }
        function isSaved(id) {
            return getSaved().some(p => p.id === id);
        }
        function saveParcel(parcel) {
            const list = getSaved();
            if (list.some(p => p.id === parcel.id)) return { ok: false, reason: 'duplicate' };
            if (list.length >= MAX_SAVED) return { ok: false, reason: 'full' };
            list.push(parcel);
            setSaved(list);
            return { ok: true };
        }
        function unsaveParcel(id) {
            setSaved(getSaved().filter(p => p.id !== id));
        }

        function renderSavedMarkers() {
            savedMarkers.forEach(m => m.setMap(null));
            savedMarkers = [];
            if (!map) return;

            getSaved().forEach(p => {
                if (!p.lat || !p.lng) return;
                const marker = new google.maps.Marker({
                    position: { lat: p.lat, lng: p.lng },
                    map,
                    icon: {
                        path: 'M 0,-10 L 2.6,-3 L 10,-3 L 4,2 L 6.5,10 L 0,5 L -6.5,10 L -4,2 L -10,-3 L -2.6,-3 Z',
                        fillColor: '#ffc107',
                        fillOpacity: 1,
                        strokeColor: '#7a5a00',
                        strokeWeight: 1.5,
                        scale: 1.3,
                        anchor: new google.maps.Point(0, 0),
                    },
                    title: p.title || 'قطعة محفوظة',
                    zIndex: 999,
                });
                marker.addListener('click', () => {
                    map.panTo({ lat: p.lat, lng: p.lng });
                    if (map.getZoom() < 17) map.setZoom(17);
                    fetchParcel(p.lat, p.lng);
                });
                savedMarkers.push(marker);
            });
        }

        /* ═══════ البحث برقم الهوية العقارية ═══════ */
        async function searchByReId() {
            const input = document.getElementById('re-search-input');
            const btn   = document.getElementById('re-search-btn');
            const reId  = input.value.trim();
            if (!reId) { input.focus(); return; }

            btn.disabled = true;
            btn.textContent = '⏳';

            try {
                const res = await fetch(`${PROXY_URL}/search?re_id=${encodeURIComponent(reId)}`);
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                if (!data.features || data.features.length === 0) {
                    throw new Error('لم يتم العثور');
                }

                const f = data.features[0];
                if (f.geometry && f.geometry.rings) {
                    const ring = f.geometry.rings[0];
                    const cx = ring.reduce((s, p) => s + p[0], 0) / ring.length;
                    const cy = ring.reduce((s, p) => s + p[1], 0) / ring.length;
                    map.panTo({ lat: cy, lng: cx });
                    map.setZoom(17);
                    fetchParcel(cy, cx);
                } else {
                    throw new Error('لا توجد إحداثيات للقطعة');
                }
            } catch (err) {
                showWarn('البحث: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'بحث';
            }
        }

        /* ═══════ الحالة الفارغة لتبويب الأراضي (بحث + محفوظات) ═══════ */
        function renderLandsEmpty() {
            const saved = getSaved();
            const searchHtml = `
                <div class="re-search">
                    <input id="re-search-input" placeholder="رقم الهوية العقارية..." />
                    <button id="re-search-btn" onclick="searchByReId()">بحث</button>
                </div>`;

            let body;
            if (saved.length === 0) {
                body = `
                    <div class="lands-empty-hint">
                        <div class="icon">🏡</div>
                        <div>انقر على قطعة في الخريطة، أو ابحث برقم الهوية، أو احفظ قطعاً لعرضها هنا</div>
                    </div>`;
            } else {
                const items = saved.map(p => `
                    <div class="saved-item" data-id="${escapeHtml(p.id)}">
                        <div class="saved-star">⭐</div>
                        <div class="saved-info">
                            <div class="saved-title">${escapeHtml(p.title || 'قطعة')}</div>
                            <div class="saved-sub">${escapeHtml(p.subtitle || '')}</div>
                        </div>
                        <button class="saved-remove" data-remove="${escapeHtml(p.id)}" title="حذف">×</button>
                    </div>`).join('');
                body = `
                    <div class="saved-section">
                        <h3>
                            <span>⭐ القطع المحفوظة</span>
                            <span class="saved-count">${saved.length} / ${MAX_SAVED}</span>
                        </h3>
                        ${items}
                    </div>`;
            }

            document.getElementById('tab-lands').innerHTML = searchHtml + body;

            // ربط الاحداث
            const input = document.getElementById('re-search-input');
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') searchByReId();
            });
            document.querySelectorAll('.saved-item').forEach(el => {
                el.addEventListener('click', e => {
                    if (e.target.classList.contains('saved-remove')) return;
                    const id = el.dataset.id;
                    const p = getSaved().find(x => x.id === id);
                    if (p && p.lat && p.lng) {
                        map.panTo({ lat: p.lat, lng: p.lng });
                        if (map.getZoom() < 17) map.setZoom(17);
                        fetchParcel(p.lat, p.lng);
                    }
                });
            });
            document.querySelectorAll('.saved-remove').forEach(el => {
                el.addEventListener('click', e => {
                    e.stopPropagation();
                    unsaveParcel(el.dataset.remove);
                    renderLandsEmpty();
                });
            });
        }

        /* ─── تبويب الأراضي ─── */
        function renderLandsTab(selected) {
            const a = selected.attributes || {};
            const subUse = LAND_USE_DETAIL[a.DETAILSLANDUSE];

            if (a.SUBDIVISIONPARCELNUMBER) subtitleParts.push(`قطعة ${a.SUBDIVISIONPARCELNUMBER}`);

                        ${saved ? '⭐ محفوظة — احذف' : canSave ? '☆ احفظ هذه القطعة' : `☆ الحد الأقصى (${MAX_SAVED})`}
                    </button>
                </div>`;

            let html = toolbar;
            html += buildSection('البيانات الأساسية', [
                ['المساحة التقريبية', a.MEASUREDAREA, v => `${Number(v).toFixed(2)} م²`],
                ['الاستعمال العام', a.MAINLANDUSE, v => fmtCoded(LAND_USE_MAIN, v)],
                ['الاستعمال التفصيلي', a.DETAILSLANDUSE, v => fmtCoded(LAND_USE_DETAIL, v)],
                ['رقم القطعة', a.SUBDIVISIONPARCELNUMBER],
                ['رقم المخطط', a.SUBDIVISIONPLAN_ID],
            ]);
            html += buildSection('بيانات واشتراطات البناء', [
                ['عدد الأدوار', a.NOOFFLOORS],
                ['عدد الوحدات السكنية', a.RESIDENTIALUNITS],
                ['عدد الوحدات التجارية', a.COMMERCIALUNITS],
                ['إجمالي الوحدات', a.UNITSNUMBER],
            ]);
            html += buildSection('الهوية العقارية', [
                ['رقم الهوية العقارية', a.RE_PARCELID],
                ['الرقم الداخلي للهوية', a.IN_PARCELID],
                ['حالة الهوية', a.PARCELSTATUS, v => fmtCoded(PARCEL_STATUS, v)],

            html += buildSection('بيانات الترخيص', [
                ['رقم الرخصة', a.LICENSENUMBER],
                ['سنة الترخيص', a.DATEOFLICENSEHIJRI, v => `${v} هـ`],
            ]);
            html += buildSection('الموقع', [['الشارع', a.ROADCENTERLINENAME_AR]]);
            html += renderDealsSection(a.RE_PARCELID);
            html += buildSection('معلومات إدارية', [
                ['الأمانة/البلدية', a.DATAOWNER],
                ['المصدر', 'وزارة البلديات والإسكان — منصة بلدي'],
                ['تاريخ الإنشاء', a.CREATED_DATE, fmtDate],
                ['تاريخ آخر تعديل', a.LAST_EDITED_DATE, fmtDate],

            document.getElementById('tab-lands').innerHTML = html;
        }

        function toggleSave() {
            const a = lastData?.selected?.attributes || {};
            const id = a.RE_PARCELID || a.IN_PARCELID || a.GLOBALID || `${lastData?.lat},${lastData?.lng}`;
            if (isSaved(id)) {
                unsaveParcel(id);
                showWarn('تم حذف القطعة من المحفوظات', 2000);
            } else {
                const subUse = LAND_USE_DETAIL[a.DETAILSLANDUSE];
                const mainUse = LAND_USE_MAIN[a.MAINLANDUSE];
                const title = subUse || mainUse || 'قطعة أرض';
                const subtitleParts = [];
                if (a.ROADCENTERLINENAME_AR) subtitleParts.push(`شارع ${a.ROADCENTERLINENAME_AR}`);
                if (a.SUBDIVISIONPARCELNUMBER) subtitleParts.push(`قطعة ${a.SUBDIVISIONPARCELNUMBER}`);

                const res = saveParcel({
                    id, title,
                    subtitle: subtitleParts.join(' ، '),
                    lat: lastData?.lat,
                    lng: lastData?.lng,
                    reId: a.RE_PARCELID,
                    savedAt: Date.now(),
                });

        /* ─── قائمة أحياء المدينة الحالية ─── */
        function renderDistrictsList() {
            const container = document.getElementById('tab-districts');

            if (!map || !map.data) {
                container.innerHTML = emptyTab('🏘️', 'لم تُحمَّل الأحياء بعد');

                    'حرّك الخريطة إلى الرياض، جدة، مكة، الدمام أو أي مدينة سعودية رئيسية');
                return;
            }

            // حمّل صفقات المدينة مرة واحدة فقط — بعد التحميل أعد الرسم
            if (!triedDeals.has(currentCity)) {
                loadCityDeals(currentCity).then(ok => {
                    if (ok && activeTab === 'districts' && !selectedDistrictId) {
                        const now = getCurrentMapCity();
                        if (now === currentCity) renderDistrictsList();
                    }
                });
            }

            const cityAr = CITY_NAMES_AR[currentCity] || currentCity;

            // اجمع كل أحياء هذه المدينة
            const items = [];
            map.data.forEach(feature => {
                const fc = getFeatureCity(feature);
                if (fc !== currentCity) return;

                const name = feature.getProperty('name:ar') || feature.getProperty('name') || 'حي';
                const id = feature.getId();
                items.push({ id, name, feature, stats: getDistrictStats(id, name, currentCity) });
            });

            if (items.length === 0) {
                container.innerHTML = emptyTab('📭',
                    `لا توجد أحياء محمّلة لمدينة ${cityAr}`,
                    'استخدم osm_converter.html لجلب أحياء هذه المدينة');
                return;
            }

            // ترتيب: البيانات الحقيقية أولاً، ثم تنازلياً حسب شدة التغيّر
            items.sort((a, b) => {
                if (a.stats.hasRealData !== b.stats.hasRealData) {
                    return a.stats.hasRealData ? -1 : 1;
                }
                return Math.abs(b.stats.kpis.weeklyChange) - Math.abs(a.stats.kpis.weeklyChange);
            });

            // احفظ حالة خانة البحث قبل إعادة الرسم
            const prevInput = document.getElementById('district-search');
            const wasFocused = prevInput && document.activeElement === prevInput;

            const q = (prevInput?.value || '').trim();

                ? items.filter(it => normalizeDistrictName(it.name).includes(normalizeDistrictName(q)))

            const header = `
                <div class="districts-list-header">

                </div>`;

            const list = filtered.length === 0
                ? `<div class="list-empty-search">لا توجد أحياء تطابق "${escapeHtml(q)}"</div>`
                : filtered.map(item => {
                const ch = item.stats.kpis.weeklyChange;
                const sign = ch >= 0 ? '▲' : '▼';
                const cls = ch >= 0 ? 'positive' : 'negative';
                const estimatedBadge = item.stats.hasRealData

                    <div class="district-list-item ${item.stats.hasRealData ? 'has-real-data' : 'estimated'}" data-id="${escapeHtml(String(item.id))}">

                        </div>
                    </div>`;
            }).join('');

            container.innerHTML = header + '<div>' + list + '</div>';

            // أعد التركيز فقط إن كان الحقل مركّزاً قبل إعادة الرسم

                    newInput.focus({ preventScroll: true });

        function extractAllRings(geom) {
            if (!geom) return [];
            const type = geom.getType();
            if (type === 'Polygon') return ringsFromPolygon(geom);
            if (type === 'MultiPolygon') {
                const all = [];
                geom.getArray().forEach(p => all.push(...ringsFromPolygon(p)));
                return all;
            }
            return [];
        }

        /* ═══════ تتبع المدن المحمّلة ═══════ */

        /* ═══════ جلب أحياء مدينة من Worker عند الحاجة ═══════ */
        async function loadCityDistricts(cityId) {
            if (loadedCities.has(cityId)) return true;
            if (!CITY_BBOX[cityId]) return false;

            const cityAr = CITY_NAMES_AR[cityId] || cityId;
            showWarn(`⏳ جاري تحميل أحياء ${cityAr}...`, 45000);

            try {
                const res = await fetch(`${PROXY_URL}/districts?city=${cityId}`);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                if (!data.features || data.features.length === 0) {
                    throw new Error('لا توجد أحياء');
                }

                // تصفية الأحياء بدون أسماء
                data.features = data.features.filter(f => {
                    const name = f.properties?.['name:ar'] || f.properties?.name;
                    return name && name.trim().length > 2;
                });

                map.data.addGeoJson(data);
                map.data.setStyle(styleDistrictFeature); // ضمان تطبيق النمط على الجديدة
                loadedCities.add(cityId);

                document.querySelectorAll('.warn').forEach(e => e.remove());
                console.log(`✓ حُمّل ${data.features.length} حياً لـ ${cityId} (${data._cached || 'fresh'})`);
                return true;
            } catch (err) {
                document.querySelectorAll('.warn').forEach(e => e.remove());
                showWarn(`تعذر تحميل أحياء ${cityAr}: ${err.message}`);
                return false;
            }
        }

        function getCityAtPoint(lat, lng) {
            for (const [city, [s, w, n, e]] of Object.entries(CITY_BBOX)) {
                if (lat >= s && lat <= n && lng >= w && lng <= e) return city;
            }
            return null;
        }
        function getCurrentMapCity() {
            if (!map) return null;
            const c = map.getCenter();
            return getCityAtPoint(c.lat(), c.lng());
        }
        function getFeatureCity(feature) {
            const prop = feature.getProperty('_city');
            if (prop && CITY_BBOX[prop]) return prop;
            // حساب من centroid عند غياب الخاصية
            const rings = extractAllRings(feature.getGeometry());
            if (rings.length === 0) return null;
            const r = rings[0];
            const cx = r.reduce((s, p) => s + p[0], 0) / r.length;
            const cy = r.reduce((s, p) => s + p[1], 0) / r.length;
            return getCityAtPoint(cy, cx);
        }

        async function selectCityFromList(cityId) {
            console.log('→ selectCityFromList:', cityId);

            google.maps.event.addListenerOnce(map, 'idle', () => {
                if (map.getZoom() > 12) map.setZoom(12);
            });

            // نظّف اختيار الحي والقطعة السابقة والخريطة التفاعلية

            const legend = document.getElementById('map-legend');

            if (topbar) topbar.classList.remove('visible');

            if (lastData?.selected) delete lastData.selected;
            if (lastData?.results) delete lastData.results;
            // أزل ماركر القطعة والمضلّع لو كانا على الخريطة

            if (hdr) {
                hdr.classList.remove('empty');
                document.getElementById('sb-title').textContent = CITY_NAMES_AR[cityId] || cityId;
                document.getElementById('sb-subtitle').textContent = 'مدينة';
                document.getElementById('sb-source').style.display = 'none';
            }

            // اعرض تفاصيل المدينة (تظهر حالة "جاري التحميل" إذا لم تُحمَّل)
            try {
                renderCityDetail(cityId);
                console.log('✓ تم رسم تفاصيل المدينة', cityId);
            } catch (err) {
                console.error('فشل renderCityDetail:', err);
            }

            // على الجوال: وسّع اللوحة لإظهار التفاصيل
            expandMobilePanel(CITY_NAMES_AR[cityId] || cityId);

            // جلب أحياء المدينة تلقائياً إن لم تكن محمّلة
            rescanLoadedCities();
            if (!loadedCities.has(cityId)) {
                const ok = await loadCityDistricts(cityId);
                if (ok) {
                    map.data.setStyle(styleDistrictFeature);
                    try { renderCityDetail(cityId); } catch (e) { console.error(e); }
                }
            }
            // جلب صفقات المدينة
            await loadCityDeals(cityId);
            if (lastData?.selectedCity === cityId) {
                try { renderCityDetail(cityId); } catch (e) { console.error(e); }
            }
            // حدّث URL
            updateURL({ city: cityId, thematic: activeThematicKey });
        }

        function renderCityDetail(cityId) {
            const name = CITY_NAMES_AR[cityId] || cityId;
            const stats = getCityStats(cityId);

            // عدّ الأحياء المحمّلة لهذه المدينة
            let loadedDistricts = 0;
            if (map && map.data) {
                map.data.forEach(f => { if (getFeatureCity(f) === cityId) loadedDistricts++; });
            }

            const backBtn = `<button class="back-btn" onclick="backToCitiesList()">← العودة لقائمة المدن</button>`;

            const loadedHint = loadedDistricts === 0
                ? `<div class="status" style="background:#fff3cd;color:#856404;border:1px solid #ffc107;padding:10px;border-radius:4px;margin:10px 0;font-size:12px">
                      ⚠ لم تُحمَّل أحياء هذه المدينة. افتح <code>osm_converter.html</code> لجلبها.
                   </div>`
                : `<div style="color:#555;font-size:12px;margin:4px 0 14px">
                      ✓ ${loadedDistricts} حي محمّل على الخريطة
                   </div>`;

            // لوحة الخرائط التفاعلية (محمية بـ try-catch حتى لا تكسر العرض)
            let thematicHtml = '';
            try {
                thematicHtml = buildThematicPanel(cityId);
            } catch (err) {
                console.error('فشل بناء لوحة الخرائط:', err);
                thematicHtml = '<div style="color:#999;font-size:11px;padding:10px">الخرائط التفاعلية غير متوفرة</div>';
            }

            const html = backBtn + `
                <div class="district-title">${escapeHtml(name)}</div>
                ${loadedHint}
                <div class="kpi-grid">
                    <div class="kpi-card">
                        <div class="kpi-value">${stats.totalDistricts}</div>
                        <div class="kpi-label">إجمالي الأحياء</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-value">${stats.avgPrice.toLocaleString('ar-SA')}</div>
                        <div class="kpi-label">ريال/م² متوسط</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-value ${stats.weeklyChange >= 0 ? 'positive' : 'negative'}">
                            ${stats.weeklyChange >= 0 ? '▲' : '▼'} ${Math.abs(stats.weeklyChange)}%
                        </div>
                        <div class="kpi-label">تغيّر أسبوعي</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-value">${stats.weeklyDeals.toLocaleString('ar-SA')}</div>
                        <div class="kpi-label">صفقة الأسبوع</div>
                    </div>
                </div>
                <div class="chart-block">
                    <div class="chart-heading">متوسط سعر م² في المدينة — آخر 12 شهر</div>
                    <div class="chart-container"><canvas id="city-chart-price"></canvas></div>
                </div>
                ${thematicHtml}`;

            document.getElementById('tab-city').innerHTML = html;
            setTimeout(() => drawCityPriceChart(stats.priceHistory), 50);
        }

        function backToCitiesList() {
            console.log('→ backToCitiesList');
            try {
                if (lastData) delete lastData.selectedCity;
                activeThematicKey = null;
                updateURL({}); // URL نظيف
                const legend = document.getElementById('map-legend');
                if (legend) legend.style.display = 'none';
                const topbar = document.getElementById('thematic-topbar');
                if (topbar) topbar.classList.remove('visible');
                if (map?.data) {
                    map.data.revertStyle();
                    map.data.setStyle(styleDistrictFeature);
                }
                // على الجوال: وسّع اللوحة لعرض قائمة المدن
                if (isMobile()) expandMobilePanel('المدن');
                renderCitiesList();

                const hdr = document.getElementById('sidebar-header');
                if (hdr) hdr.classList.add('empty');
                const title = document.getElementById('sb-title');
                if (title) title.textContent = 'اختر قطعة أو حي من الخريطة';
                const subtitle = document.getElementById('sb-subtitle');
                if (subtitle) subtitle.textContent = '';
            } catch (err) {
                console.error('فشل backToCitiesList:', err);
            }
        }

        function drawCityPriceChart(h) {
            const canvas = document.getElementById('city-chart-price');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            chartInstances.push(new Chart(ctx, {
                type: 'line',
                data: { labels: h.labels, datasets: [
                    { label: 'السعر (ر.س/م²)', data: h.values,
                      borderColor: '#2c8c7c', backgroundColor: 'rgba(44,140,124,0.1)',
                      tension: 0.3, pointRadius: 3, fill: true },
                ]}, options: CHART_COMMON_OPTS
            }));
        }

        /* ═══════ بيانات المدينة (placeholder حتمية) ═══════ */
        function getCityStats(cityId) {
            const seed = hashStr(cityId);
            const rand = n => ((seed >> n) % 1000) / 1000;

            const avgPrice = 2500 + Math.round(rand(0) * 8500);
            const weeklyChange = parseFloat((rand(3) * 10 - 3).toFixed(1));
            const totalDistricts = 50 + Math.round(rand(5) * 250);
            const weeklyDeals = 500 + Math.round(rand(7) * 2500);

            const labels12m = ['مايو','يون','يول','أغس','سبت','أكت','نوف','ديس','ين','فبر','مار','أبر'];
            const values = [];
            let p = avgPrice * 0.92;
            for (let i = 0; i < 12; i++) {
                p += (rand(10 + i) - 0.4) * avgPrice * 0.02;
                values.push(Math.round(p));
            }
            return {
                avgPrice, weeklyChange, totalDistricts, weeklyDeals,
                priceHistory: { labels: labels12m, values },
            };
        }

        /* ═══════ الرسوم البيانية ═══════ */
        const CHART_COMMON_OPTS = {
            responsive: true, maintainAspectRatio: false,
            plugins: {
                legend: { position: 'top', align: 'start',

                tooltip: { rtl: true, bodyFont: { size: 11 }, titleFont: { size: 11 } }
            },
            scales: {
                x: { ticks: { font: { size: 10 } }, grid: { display: false } },
                y: { ticks: { font: { size: 10 } }, grid: { color: '#f0f0f0' } }
            }
        };
        function drawPriceChart(h) {
            const ctx = document.getElementById('chart-price').getContext('2d');
            chartInstances.push(new Chart(ctx, {
                type: 'line',
                data: { labels: h.labels, datasets: [
                    { label: 'تجاري', data: h.commercial,
                      borderColor: '#e6a82e', backgroundColor: 'transparent',
                      tension: 0.3, pointRadius: 3 },
                    { label: 'سكني', data: h.residential,
                      borderColor: '#2c8c7c', backgroundColor: 'transparent',
                      tension: 0.3, pointRadius: 3 },
                ]}, options: CHART_COMMON_OPTS
            }));
        }
        function drawCompareChart(c) {
            const ctx = document.getElementById('chart-compare').getContext('2d');
            chartInstances.push(new Chart(ctx, {
                type: 'line',
                data: { labels: c.labels, datasets: [
                    { label: 'متوسط الرياض', data: c.cityAvg,
                      borderColor: '#999', borderDash: [4, 4],
                      backgroundColor: 'transparent', tension: 0.3, pointRadius: 2 },

            }));
        }
        function drawDealsChart(d) {
            const ctx = document.getElementById('chart-deals').getContext('2d');
            chartInstances.push(new Chart(ctx, {
                type: 'bar',
                data: { labels: d.labels, datasets: [
                    { label: 'متوسط المدينة', data: d.cityAvg, backgroundColor: '#cfd8d5' },
                    { label: 'الحي', data: d.district, backgroundColor: '#2c8c7c' },
                ]}, options: CHART_COMMON_OPTS
            }));
        }

        /* ═══════ الخرائط التفاعلية ═══════ */

        // تعريف كل مؤشر: المفتاح، العنوان، الفئة، نوع المقياس، دالة الاستخراج
        const THEMATIC_METRICS = {
            // 🏠 المشتري السكني
            price     : { cat: 'buyer', label: 'سعر م²',         type: 'heatmap',    real: true,
                          desc: 'متوسط سعر المتر المربّع في كل حي من صفقات وزارة العدل. الأحياء الأغمق لوناً تعني أسعار أعلى.',
                          value: d => d.medianPpm || d.avgPpm,
                          format: v => `${Math.round(v).toLocaleString('ar-SA')} ر.س/م²` },
            pchange   : { cat: 'buyer', label: 'تغيّر السعر',     type: 'diverging',  real: true,
                          desc: 'التغيّر في متوسط سعر المتر بين النصف الأقدم والأحدث من صفقات الربع. الأخضر = ارتفاع، الأحمر = انخفاض.',
                          value: d => calcTrendFromDeals(d.deals),
                          format: v => `${v >= 0 ? '+' : ''}${v.toFixed(1)}%` },
            compare   : { cat: 'buyer', label: 'مقارنة بالمدينة', type: 'diverging',  real: true,
                          desc: 'نسبة فرق سعر الحي عن متوسط المدينة. الأخضر = أغلى من المتوسط، الأحمر = أرخص.',
                          value: (d, ctx) => ctx.cityAvg ? ((d.medianPpm - ctx.cityAvg) / ctx.cityAvg * 100) : 0,
                          format: v => `${v >= 0 ? '+' : ''}${v.toFixed(1)}%` },

            // 📈 المستثمر
            demand    : { cat: 'investor', label: 'مؤشر الطلب',   type: 'heatmap',    real: true,
                          desc: 'عدد الصفقات في الحي كمؤشر على نشاط الطلب. الأحياء الأغمق = طلب أعلى.',
                          value: d => d.count,
                          format: v => `${v} صفقة` },
            value     : { cat: 'investor', label: 'القيمة',       type: 'heatmap',    real: true,
                          desc: 'إجمالي قيمة الصفقات المنفذة في الحي خلال الفترة. الأغمق = حجم تداول أكبر.',
                          value: d => d.totalVolume,
                          format: v => `${(v / 1_000_000).toFixed(1)} م.ر` },
            return    : { cat: 'investor', label: 'العائد',       type: 'heatmap',    real: false },

            // 🏢 الوسيط العقاري
            deals     : { cat: 'broker', label: 'الصفقات',        type: 'heatmap',    real: true,
                          desc: 'عدد صفقات البيع المسجّلة في الحي. مؤشر على فرص الوساطة.',
                          value: d => d.count,
                          format: v => `${v} صفقة` },
            dchange   : { cat: 'broker', label: 'تغيّر الصفقات',  type: 'diverging',  real: false },
            velocity  : { cat: 'broker', label: 'سرعة البيع',     type: 'heatmap',    real: true,
                          desc: 'متوسط الصفقات الشهرية في الحي خلال الربع. الأحياء الأغمق تدور فيها صفقات أسرع.',
                          value: d => d.count / 3,
                          format: v => `${v.toFixed(1)} صفقة/شهر` },

            // 🏗 المطوّر
            build     : { cat: 'dev', label: 'نسبة البناء',    type: 'heatmap',    real: false },
            white     : { cat: 'dev', label: 'أراضي بيضاء',   type: 'heatmap',    real: false },
            supplygap : { cat: 'dev', label: 'فجوة العرض',    type: 'diverging',  real: false },

            // 💵 الإيجار
            rentR     : { cat: 'rent', label: 'إيجار سكني',   type: 'heatmap',    real: false },
            rentC     : { cat: 'rent', label: 'إيجار تجاري',  type: 'heatmap',    real: false },
            rentChg   : { cat: 'rent', label: 'تغيّر الإيجار', type: 'diverging',  real: false },
            rentAct   : { cat: 'rent', label: 'نشاط الإيجار', type: 'heatmap',    real: false },
            realRet   : { cat: 'rent', label: 'العائد الحقيقي',type: 'heatmap',    real: false },
            occupancy : { cat: 'rent', label: 'نسبة الإشغال', type: 'heatmap',    real: false },
        };

        const THEMATIC_CATEGORIES = {
            buyer   : { title: 'المشتري السكني',   icon: '🏠' },
            investor: { title: 'المستثمر',         icon: '📈' },
            broker  : { title: 'الوسيط العقاري',   icon: '🏢' },
            dev     : { title: 'المطوّر',           icon: '🏗' },
            rent    : { title: 'الإيجار · منصة إيجار', icon: '💵' },
        };

        let activeThematicKey = null;

        function buildThematicPanel(cityId) {
            const html = [];
            html.push('<div class="thematic-panel">');
            html.push('<div class="t-header"><h3>🗺️ الخرائط التفاعلية</h3></div>');
            html.push('<p class="t-intro">اضغط على أي مؤشر لتلوين أحياء المدينة على الخريطة حسب قيمته. تساعد هذه الخرائط على كشف الأنماط المكانية بسرعة.</p>');

            for (const [catKey, catMeta] of Object.entries(THEMATIC_CATEGORIES)) {
                const metrics = Object.entries(THEMATIC_METRICS).filter(([, m]) => m.cat === catKey);
                if (metrics.length === 0) continue;
                html.push('<div class="thematic-category">');
                html.push(`<div class="thematic-category-title">${catMeta.icon} ${catMeta.title}</div>`);
                html.push('<div class="thematic-buttons">');
                for (const [key, m] of metrics) {
                    const cls = [
                        'thematic-btn',
                        m.real ? '' : 'soon',
                        activeThematicKey === key ? 'active' : '',
                    ].filter(Boolean).join(' ');
                    const onclick = m.real ? `applyThematicMap('${key}')` : '';
                    html.push(`<button class="${cls}" ${onclick ? `onclick="${onclick}"` : ''}>${m.label}</button>`);
                }
                html.push('</div></div>');
            }

            // أسطورة المؤشر النشط
            if (activeThematicKey) {
                const m = THEMATIC_METRICS[activeThematicKey];
                const legend = window._lastLegend || {};
                html.push('<div class="thematic-legend">');
                html.push(`<div class="tl-title">${escapeHtml(m.label)}</div>`);
                if (m.desc) html.push(`<div class="tl-desc">${escapeHtml(m.desc)}</div>`);
                html.push(`<div class="tl-scale ${m.type === 'diverging' ? 'diverging' : ''}"></div>`);
                if (legend.min != null && legend.max != null) {
                    const fmt = m.format || (v => Math.round(v));
                    html.push('<div class="tl-labels">');
                    if (m.type === 'diverging') {
                        html.push(`<span>${fmt(legend.min)}</span><span>0</span><span>${fmt(legend.max)}</span>`);
                    } else {
                        html.push(`<span>${fmt(legend.min)}</span><span>${fmt(legend.max)}</span>`);
                    }
                    html.push('</div>');
                }
                html.push('</div>');
            }

            html.push('</div>');
            return html.join('');
        }

        /* ═══════ تلوين الخريطة حسب المؤشر ═══════ */
        function applyThematicMap(key) {
            if (activeThematicKey === key) {
                clearThematicMap();
                return;
            }
            activeThematicKey = key;
            renderThematicMap();
            // حدّث URL — الخرائط التفاعلية تخص المدينة فقط
            updateURL({
                city: lastData?.selectedCity || getCurrentMapCity(),
                district: lastData?.district?.name,
                thematic: key,
            });

            // على الجوال: صغّر اللوحة للرأس فقط — الخريطة التفاعلية تحتاج رؤية كاملة
            if (isMobile()) {
                const title = lastData?.district?.name
                    || (lastData?.selectedCity
                        ? (CITY_NAMES_AR[lastData.selectedCity] || lastData.selectedCity)
                        : 'المدينة');
                minimizeMobilePanel(title);
                // إعادة رسم التفاصيل (ستظهر عندما يوسّع المستخدم اللوحة)
                setTimeout(() => {
                    if (lastData?.district) {
                        renderDistrictTab(lastData);
                    } else if (lastData?.selectedCity) {
                        renderCityDetail(lastData.selectedCity);
                    }
                }, 320);
            } else {
                // على الديسكتوب: أعد الرسم مباشرة
                if (lastData?.district) renderDistrictTab(lastData);
                else if (lastData?.selectedCity) renderCityDetail(lastData.selectedCity);
            }
        }

        function scrollToThematicPanel() {
            const wrapper = document.querySelector('.tab-content-wrapper');
            const panel = document.querySelector('.thematic-panel');
            if (!wrapper || !panel) return;
            // حرّك محتوى اللوحة بحيث يظهر الجزء النشط من الخرائط التفاعلية
            const topOffset = panel.offsetTop - 10;
            wrapper.scrollTo({ top: topOffset, behavior: 'smooth' });
        }

        function clearThematicMap() {
            activeThematicKey = null;
            window._lastLegend = null;
            // حدّث URL — احتفظ بالمدينة/الحي (إن وُجدا) وأزل الخريطة التفاعلية
            updateURL({
                city: lastData?.selectedCity || getCurrentMapCity(),
                district: lastData?.district?.name,
            });
            if (map?.data) {
                map.data.revertStyle();
                map.data.setStyle(styleDistrictFeature);
                // أعد تمييز الحي المختار إن وُجد
                if (selectedDistrictId) {
                    map.data.forEach(f => {
                        if (f.getId() === selectedDistrictId) {
                            map.data.overrideStyle(f, styleDistrictFeature(f));
                        }
                    });
                }
            }
            // أخفِ الشريط العلوي
            const topbar = document.getElementById('thematic-topbar');
            if (topbar) topbar.classList.remove('visible');
            const legend = document.getElementById('map-legend');
            if (legend) legend.style.display = 'none';

            // على الجوال: وسّع اللوحة (لا حاجة للخريطة النصفية)
            if (isMobile()) {
                const title = lastData?.district?.name
                    || (lastData?.selectedCity ? (CITY_NAMES_AR[lastData.selectedCity] || lastData.selectedCity) : 'التفاصيل');
                expandMobilePanel(title);
            }

            // أعد الرسم حسب الشاشة الحالية: حي مختار → تفاصيل الحي، وإلا → المدينة
            if (lastData?.district) {
                renderDistrictTab(lastData);
            } else if (lastData?.selectedCity) {
                renderCityDetail(lastData.selectedCity);
            }
        }

        function renderThematicMap() {
            if (!activeThematicKey || !map?.data) return;
            const metric = THEMATIC_METRICS[activeThematicKey];
            if (!metric) return;

            const city = getCurrentMapCity();
            if (!city) return;

            // تأكد من وجود الصفقات
            const cityDeals = getCityDeals(city);
            if (!cityDeals) {
                showWarn('لا تتوفر بيانات صفقات لهذه المدينة بعد', 3000);
                clearThematicMap();
                return;
            }

            // جمع القيم
            const entries = [];
            const cityValues = Object.values(cityDeals).map(d => d.medianPpm || d.avgPpm);
            const cityAvg = cityValues.length
                ? cityValues.reduce((s, v) => s + v, 0) / cityValues.length
                : 0;
            const ctx = { cityAvg };

            map.data.forEach(feature => {
                const fc = getFeatureCity(feature);
                if (fc !== city) return;
                const name = feature.getProperty('name:ar') || feature.getProperty('name');
                if (!name) return;
                const d = getDealsForDistrict(city, name);
                if (!d) return;
                const v = metric.value(d, ctx);
                if (v == null || isNaN(v)) return;
                entries.push({ feature, value: v });
            });

            if (entries.length === 0) {
                showWarn('لا توجد قيم كافية لرسم الخريطة', 3000);
                clearThematicMap();
                return;
            }

            // حساب المقياس
            const values = entries.map(e => e.value);
            const min = Math.min(...values);
            const max = Math.max(...values);

            // الزوم القريب (≥ 15): أخفِ التلوين تماماً لإظهار القطع
            const zoom = map.getZoom() ?? 12;
            const hideForParcels = zoom >= 15;

            // تطبيق التلوين (أو الإخفاء عند الزوم القريب)
            map.data.revertStyle();
            map.data.forEach(feature => {
                const fc = getFeatureCity(feature);
                if (fc !== city) {
                    map.data.overrideStyle(feature, { visible: false });
                }
            });

            if (!hideForParcels) {
                entries.forEach(({ feature, value }) => {
                    const color = metric.type === 'diverging'
                        ? divergingColor(value, Math.max(Math.abs(min), Math.abs(max)))
                        : heatmapColor(value, min, max);
                    map.data.overrideStyle(feature, {
                        fillColor: color,
                        fillOpacity: 0.72,
                        strokeColor: '#1a1a1a',
                        strokeOpacity: 0.5,
                        strokeWeight: 0.5,
                        clickable: true,
                        visible: true,
                    });
                });
            } else {
                // في الزوم القريب: أخفِ كل أحياء المدينة (اترك القطع مرئية)
                entries.forEach(({ feature }) => {
                    map.data.overrideStyle(feature, { visible: false, clickable: false });
                });
            }

            // احفظ min/max لعرضهم في اللوحة الجانبية
            window._lastLegend = { min, max, type: metric.type };

            // شريط علوي يذكّر المستخدم بالخريطة التفاعلية النشطة
            const topbar = document.getElementById('thematic-topbar');
            const label  = document.getElementById('thematic-topbar-label');
            console.log('🎨 renderThematicMap:', {
                activeKey: activeThematicKey,
                metric: metric.label,
                hideForParcels,
                zoom,
                topbarFound: !!topbar,
                labelFound: !!label,
                entries: entries.length,
            });
            if (topbar && label) {
                if (hideForParcels) {
                    topbar.classList.remove('visible');
                } else {
                    label.textContent = metric.label;
                    topbar.classList.add('visible');
                    console.log('✓ topbar shown, classes:', topbar.className);
                }
            }
            // أخفِ شارة الليجيند القديمة (لم نعد نستخدمها)
            const legend = document.getElementById('map-legend');
            if (legend) legend.style.display = 'none';
        }

        function heatmapColor(v, min, max) {
            // أبيض → أخضر الفيروز (داكن)
            if (max === min) return '#7fd4c1';
            const t = (v - min) / (max - min); // 0..1
            // خلط #ffffff → #2c8c7c
            const r = Math.round(255 + t * (44  - 255));
            const g = Math.round(255 + t * (140 - 255));
            const b = Math.round(255 + t * (124 - 255));
            return `rgb(${r},${g},${b})`;
        }

        function divergingColor(v, absMax) {
            // أحمر (سالب) → أبيض (٠) → أخضر (موجب)
            if (absMax === 0) return '#f5f5f5';
            const t = Math.max(-1, Math.min(1, v / absMax));
            if (t >= 0) {
                // أبيض → أخضر
                const r = Math.round(245 + t * (31 - 245));
                const g = Math.round(245 + t * (107 - 245));
                const b = Math.round(245 + t * (94 - 245));
                return `rgb(${r},${g},${b})`;
            } else {
                const at = Math.abs(t);
                const r = Math.round(245 + at * (192 - 245));
                const g = Math.round(245 + at * (57  - 245));
                const b = Math.round(245 + at * (43  - 245));
                return `rgb(${r},${g},${b})`;
            }
        }

        /* ═══════ نهاية الخرائط التفاعلية ═══════ */


        const loadedDeals = new Set();    // حُمِّلت بنجاح
        const triedDeals = new Set();     // جُرِّب تحميلها (نجاح أو فشل)
        const loadingDeals = new Map();   // طلبات قيد التنفيذ
        const dealsIndex = new Map();     // cityId → Map(normName → dealData)

        function getCityDeals(cityId) {
            return window[`DEALS_${cityId.toUpperCase()}`] || null;
        }

        function normalizeDistrictName(s) {
            return String(s || '')
                .trim()
                .replace(/^حي\s+/, '')
                .replace(/^الحي\s+/, '')
                .replace(/[أإآٱ]/g, 'ا')
                .replace(/ة/g, 'ه')
                .replace(/ى/g, 'ي')
                .replace(/ؤ/g, 'و')
                .replace(/ئ/g, 'ي')
                .replace(/[\u064B-\u065F\u0670]/g, '') // إزالة التشكيل
                .replace(/\s+/g, ' ')
                .toLowerCase();
        }

        function getDealsForDistrict(cityId, districtName) {
            if (!cityId || !districtName) return null;
            if (!dealsIndex.has(cityId)) {
                const cityDeals = getCityDeals(cityId);
                if (!cityDeals) return null;
                const idx = new Map();
                for (const [k, v] of Object.entries(cityDeals)) {
                    idx.set(normalizeDistrictName(k), v);
                }
                dealsIndex.set(cityId, idx);
            }
            return dealsIndex.get(cityId).get(normalizeDistrictName(districtName)) || null;
        }

        async function loadCityDeals(cityId) {
            if (loadedDeals.has(cityId)) return true;
            if (getCityDeals(cityId)) {
                loadedDeals.add(cityId);
                triedDeals.add(cityId);
                return true;
            }
            if (triedDeals.has(cityId)) return false; // جُرِّبت وفشلت، لا تعيد المحاولة
            if (loadingDeals.has(cityId)) return loadingDeals.get(cityId);

            const promise = new Promise(resolve => {
                const script = document.createElement('script');
                script.src = `deals_${cityId}.js`;
                script.async = true;
                script.onload = () => {
                    loadedDeals.add(cityId);
                    triedDeals.add(cityId);
                    loadingDeals.delete(cityId);
                    dealsIndex.delete(cityId); // أعد بناء الفهرس
                    const d = getCityDeals(cityId);
                    console.log(`✓ صفقات ${cityId}: ${d ? Object.keys(d).length : 0} حي`);
                    resolve(true);
                };
                script.onerror = () => {
                    triedDeals.add(cityId);
                    loadingDeals.delete(cityId);
                    console.log(`ℹ لا يوجد ملف صفقات deals_${cityId}.js`);
                    resolve(false);
                };
                document.head.appendChild(script);
            });
            loadingDeals.set(cityId, promise);
            return promise;
        }

        /* ═══════ بيانات الحي ═══════ */
        function hashStr(s) {
            let h = 0;
            for (let i = 0; i < (s || '').length; i++) {
                h = ((h << 5) - h + s.charCodeAt(i)) | 0;
            }
            return Math.abs(h);
        }

        function getDistrictStats(placeId, name, cityHint) {
            // ابدأ بالبيانات الحتمية كأساس، ثم اكتب فوقها البيانات الحقيقية إن وجدت
            const seed = hashStr(String(placeId || name || 'default'));
            const rand = n => (seed >> n) % 1000 / 1000;

            let basePrice = 3500 + Math.round(rand(0) * 7500);
            let weeklyChange = parseFloat((rand(3) * 16 - 8).toFixed(1));
            let weeklyDeals = 15 + Math.round(rand(5) * 280);
            const rank = 1 + Math.round(rand(7) * 149);
            let realRecentDeals = null;
            let hasRealData = false;

            // محاولة استخدام بيانات حقيقية من deals_<city>.js
            const city = cityHint || (map ? getCurrentMapCity() : null);
            if (city) {
                const d = getDealsForDistrict(city, name);
                if (d) {
                    basePrice     = Math.round(d.medianPpm || d.avgPpm);
                    weeklyDeals   = d.count;
                    const trend   = calcTrendFromDeals(d.deals);
                    if (trend !== null) weeklyChange = trend;
                    // (وإلا أبقِ weeklyChange التقديري إذا كانت العينة صغيرة)
                    realRecentDeals = d.deals;
                    hasRealData = true;
                }
            }

            const labels12m = ['مايو','يون','يول','أغس','سبت','أكت','نوف','ديس','ين','فبر','مار','أبر'];
            const labels12w = Array.from({ length: 12 }, (_, i) => `${i+1}أ`);

            const residential = [];
            const commercial  = [];
            let r = basePrice * 0.95, c = basePrice * 1.25;
            for (let i = 0; i < 12; i++) {
                r += (rand(8 + i) - 0.4) * 120;
                c += (rand(14 + i) - 0.4) * 180;
                residential.push(Math.round(r));
                commercial.push(Math.round(c));
            }

            // الصفقات: استخدم الحقيقية إن وجدت، وإلا وهمية
            let recentDeals;
            if (realRecentDeals && realRecentDeals.length) {
                recentDeals = realRecentDeals.slice(0, 5).map(d => ({
                    date : formatDealDate(d.date),
                    area : Math.round(d.area),
                    price: parseFloat((d.price / 1_000_000).toFixed(2)),
                    ppm  : d.ppm,
                    type : d.type,
                }));
            } else {
                recentDeals = [];
                for (let i = 0; i < 3; i++) {
                    const area = 300 + Math.round(rand(20 + i) * 500);
                    const ppm  = basePrice * (0.9 + rand(25 + i) * 0.2);
                    recentDeals.push({
                        date: ['15 مارس', '22 مارس', '29 مارس'][i],
                        area,
                        price: parseFloat((area * ppm / 1_000_000).toFixed(2)),
                    });
                }
            }

            return {
                name: name || 'الحي',
                hasRealData,
                ranking: { rank, total: 150 },
                kpis: {
                    cost300m    : basePrice * 300,
                    weeklyDeals,
                    weeklyChange,
                    pricePerMeter: basePrice,
                },
                priceHistory: { labels: labels12m, residential, commercial },
                cityComparison: {
                    labels: labels12m,
                    district: residential.map(v => Math.round(v * 1.02)),
                    cityAvg : residential.map(() => 9800 + Math.round(rand(30) * 300)),
                },
                weeklyDeals: {
                    labels: labels12w,
                    district: Array.from({ length: 12 }, (_, i) => 8 + Math.round(rand(40 + i) * 15)),
                    cityAvg : Array.from({ length: 12 }, (_, i) => 100 + Math.round(rand(52 + i) * 160)),
                },
                recentDeals,
            };
        }

        function calcTrendFromDeals(deals) {
            // نحتاج عينة كافية — أقل من ٦ صفقات = ضجيج إحصائي
            if (!deals || deals.length < 6) return null;
            // استخدم الوسيط بدلاً من المتوسط (مقاوم للقيم الشاذة)
            const half = Math.floor(deals.length / 2);
            const newerPpms = deals.slice(0, half).map(d => d.ppm).sort((a, b) => a - b);
            const olderPpms = deals.slice(half).map(d => d.ppm).sort((a, b) => a - b);
            const medN = newerPpms[Math.floor(newerPpms.length / 2)];
            const medO = olderPpms[Math.floor(olderPpms.length / 2)];
            if (!medO) return null;
            const pct = (medN - medO) / medO * 100;
            // قيّد القيم المتطرفة (>٣٠٪ خلال ربع = ضجيج)
            if (Math.abs(pct) > 30) return null;
            return parseFloat(pct.toFixed(1));
        }

        function formatDealDate(s) {
            // 2025/12/28 → 28 ديس
            if (!s) return '';
            const m = s.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
            if (!m) return s;
            const months = ['ين','فبر','مار','أبر','مايو','يون','يول','أغس','سبت','أكت','نوف','ديس'];
            return `${parseInt(m[3])} ${months[parseInt(m[2]) - 1] || ''}`;
        }

        /* ═══════ صفقات القطعة ═══════ */
        function renderDealsSection(parcelId) {
            const deals = getDealsFor(parcelId);
            if (!deals || deals.length === 0) {
                return `<div class="section">
                    <div class="section-title">سجل الصفقات المسجلة</div>
                    <div class="empty-state" style="padding: 20px 10px">
                        <div class="icon" style="font-size: 32px">📋</div>
                        <div class="msg">لا توجد صفقات مسجلة لهذه القطعة</div>
                    </div>
                </div>`;
            }
            const cards = deals.map(d => `
                <div class="deal-row">
                    <div class="deal-date">${escapeHtml(d.date || '')}</div>
                    <div class="deal-area">${d.area || ''} م²</div>
                    <div class="deal-price">${formatSAR(d.price)}</div>
                </div>
            `).join('');
            return `<div class="section">
                <div class="section-title">سجل الصفقات المسجلة (${deals.length})</div>
                <div class="deals-list">${cards}</div>
            </div>`;
        }
        function getDealsFor(parcelId) { return []; }
        function formatSAR(n) {
            if (n == null || isNaN(n)) return '—';
            return Number(n).toLocaleString('ar-SA') + ' ر.س';
        }

        /* ═══════ رسم ═══════ */
        function drawPolygon(result) {
            if (currentPolygon) currentPolygon.setMap(null);
            if (result.geometry && result.geometry.rings) {
                const paths = result.geometry.rings.map(ring =>
                    ring.map(p => ({ lat: p[1], lng: p[0] }))
                );
                currentPolygon = new google.maps.Polygon({
                    paths, strokeColor: '#2c8c7c', strokeOpacity: 1, strokeWeight: 2,
                    fillColor: '#2c8c7c', fillOpacity: 0.25, map, clickable: false
                });
                const bounds = new google.maps.LatLngBounds();
                paths.flat().forEach(p => bounds.extend(p));
                map.fitBounds(bounds);
            }
        }

        /* ═══════ مساعدات ═══════ */
        function buildSection(title, rows, collapsed = false) {
            const filtered = rows.filter(r => r[1] !== null && r[1] !== undefined && r[1] !== '' && r[1] !== 'Null');
            if (!filtered.length) return '';
            const id = 'sec_' + Math.random().toString(36).slice(2, 8);
            const cls = collapsed ? 'section collapsed' : 'section';
            let body = '';
            filtered.forEach(([label, value, formatter]) => {
                const display = formatter ? formatter(value) : value;
                body += `<div class="field">
                    <span class="field-label">${escapeHtml(label)}</span>
                    <span class="field-value">${escapeHtml(String(display))}</span>
                </div>`;
            });
            return `<div class="${cls}" id="${id}">
                <div class="section-title collapsible" onclick="document.getElementById('${id}').classList.toggle('collapsed')">
                    ${escapeHtml(title)}
                </div>
                <div class="section-body">${body}</div>
            </div>`;
        }
        function emptyTab(icon, msg, hint) {
            return `<div class="empty-state">
                <div class="icon">${icon}</div>
                <div class="msg">${escapeHtml(msg)}</div>
                ${hint ? `<div class="hint-text">${escapeHtml(hint)}</div>` : ''}
            </div>`;
        }
        function fmtCoded(dict, value) {
            const label = dict[String(value)];
            return label ? `${label} (${value})` : String(value);
        }
        function fmtDate(ms) {
            const n = Number(ms);
            if (!isFinite(n) || n < 1e10) return String(ms);
            return new Date(n).toLocaleDateString('ar-EG', {
                year: 'numeric', month: 'long', day: 'numeric'
            });
        }
        function fmtMillion(n) {
            if (n >= 1e6) return (n / 1e6).toFixed(1) + 'م';
            if (n >= 1e3) return (n / 1e3).toFixed(0) + 'ك';
            return Number(n).toLocaleString('ar-SA');
        }
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            })[c]);
        }
    </script>
