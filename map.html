    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        }
        #container { display: flex; height: 100vh; width: 100vw; }
        #map { flex: 1; height: 100%; position: relative; }

        #sidebar {
            width: 420px; height: 100%;
            background: #fff;
            box-shadow: 2px 0 12px rgba(0,0,0,0.08);
            display: flex; flex-direction: column;
        }
        /* على الديسكتوب: التبويبات أعلى المحتوى مباشرة */
        #sidebar .mobile-close-panel { display: none; }
        #sidebar > .sidebar-header { order: 1; }
        #sidebar > .tabs { order: 2; }
        #sidebar > .tab-content-wrapper {
            order: 3;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }
        #mobile-tabs { display: none; }  /* لا يظهر على الديسكتوب */

        .sidebar-header {
            background: linear-gradient(135deg, #2c8c7c 0%, #1f6b5e 100%);
            color: #fff; padding: 18px 20px;
            position: relative; flex-shrink: 0;
        }
        .sidebar-header h2 { margin: 0 0 6px; font-size: 17px; }
        .sidebar-header p { margin: 0; font-size: 13px; opacity: 0.9; }
        .sidebar-header.empty { background: #f5f5f5; color: #888; }
        .sidebar-header.empty h2 { color: #444; }

        .source-badge {
            display: inline-block; background: rgba(255,255,255,0.25);
            padding: 2px 8px; border-radius: 10px;
            font-size: 11px; margin-top: 6px;
        }

        .tabs {
            display: flex; background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0; flex-shrink: 0;
        }
        .tab {
            flex: 1; padding: 12px 8px; text-align: center; font-size: 13px;
            cursor: pointer; color: #666; background: transparent; border: none;
            border-bottom: 3px solid transparent;
            transition: all 0.2s; font-family: inherit;
        }
        .tab:hover { background: rgba(44,140,124,0.06); color: #2c8c7c; }
        .tab.active {
            color: #2c8c7c; font-weight: bold; background: #fff;
            border-bottom-color: #2c8c7c;
        }

        .tab-content { display: none; padding: 15px 20px; overflow-y: auto; flex: 1; }
        .tab-content.active { display: block; }

        .section { margin-bottom: 18px; }
        .section-title {
            color: #2c8c7c; font-weight: bold; font-size: 14px;
            padding-bottom: 8px; border-bottom: 2px solid #2c8c7c;
            margin-bottom: 10px;
        }
        .section-title.collapsible { cursor: pointer; user-select: none; border-bottom-style: dashed; }
        .section-title.collapsible::after {
            content: '▾'; float: left; font-size: 12px; transition: transform 0.2s;
        }
        .section.collapsed .section-title.collapsible::after { transform: rotate(180deg); }
        .section.collapsed .section-body { display: none; }

        .field {
            display: flex; justify-content: space-between;
            padding: 8px 0; font-size: 13px;
            border-bottom: 1px solid #f0f0f0; gap: 10px;
        }
        .field:last-child { border-bottom: none; }
        .field-label { color: #777; white-space: nowrap; }
        .field-value { color: #2c8c7c; font-weight: 600; text-align: left; word-break: break-word; }

        .district-title { font-size: 20px; font-weight: bold; color: #1f6b5e; margin-bottom: 4px; }
        .district-ranking { color: #888; font-size: 12px; margin-bottom: 14px; }

        .kpi-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 8px; margin-bottom: 18px;
        }
        .kpi-card {
            background: #f7faf9; border: 1px solid #e4efec;
            border-radius: 8px; padding: 10px 12px; text-align: center;
        }
        .kpi-value { font-size: 18px; font-weight: bold; color: #1f6b5e; }
        .kpi-value.positive { color: #27ae60; }
        .kpi-value.negative { color: #c0392b; }
        .kpi-label { font-size: 11px; color: #888; margin-top: 2px; }

        .chart-block { margin-bottom: 20px; }
        .chart-heading {
            font-size: 13px; color: #555; margin-bottom: 8px;
            display: flex; align-items: center; gap: 6px;
        }
        .chart-heading::before { content: '📊'; font-size: 14px; }
        .chart-container {
            position: relative; height: 160px;
            background: #fafcfb; border: 1px solid #eaf1ef;
            border-radius: 8px; padding: 8px;
        }

        .deals-list { display: flex; flex-direction: column; border-top: 1px solid #f0f0f0; }
        .deal-row {
            display: grid; grid-template-columns: 60px 1fr 1fr;
            gap: 10px; padding: 10px 4px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px; align-items: center;
        }
        .deal-row:last-child { border-bottom: none; }
        .deal-date { color: #888; font-size: 12px; }
        .deal-area { color: #555; text-align: center; }
        .deal-price { color: #2c8c7c; font-weight: bold; text-align: left; }

        .empty-state { padding: 40px 20px; text-align: center; color: #999; }
        .empty-state .icon { font-size: 42px; margin-bottom: 10px; opacity: 0.5; }
        .empty-state .msg { font-size: 13px; }
        .empty-state .hint-text { font-size: 12px; margin-top: 6px; color: #bbb; }

        .status { padding: 30px 20px; text-align: center; }
        .status.loading { color: #2c8c7c; }
        .status.error { color: #c0392b; }
        .spinner {
            border: 3px solid #eee; border-top: 3px solid #2c8c7c;
            border-radius: 50%; width: 32px; height: 32px;
            animation: spin 1s linear infinite; margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hint {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75); color: #fff;
            padding: 10px 20px; border-radius: 20px;
            font-size: 13px; pointer-events: none;
            transition: opacity 0.5s; z-index: 5;
        }
        .mode-badge {
            position: absolute; top: 10px; right: 10px;
            background: #2c8c7c; color: #fff;
            padding: 6px 14px; border-radius: 20px;
            font-size: 12px; z-index: 5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .warn {
            position: absolute; top: 10px; left: 50%;
            transform: translateX(-50%);
            background: #fff3cd; color: #856404;
            border: 1px solid #ffc107;
            padding: 8px 14px; border-radius: 6px;
            font-size: 12px; z-index: 4;
            max-width: 85%;
        }

        /* قائمة الأحياء */
        .districts-list-header {
            padding: 10px 2px;
            color: #555; font-size: 12px;
            border-bottom: 1px solid #e6ecea;
            margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }
        /* خانة بحث القوائم */
        .list-search {
            position: relative; margin-bottom: 10px;
        }
        .list-search input {
            width: 100%; padding: 9px 36px 9px 12px;
            border: 1px solid #d0d8d5; border-radius: 6px;
            font-size: 13px; font-family: inherit;
            direction: rtl; text-align: right;
        }
        .list-search input:focus {
            outline: none; border-color: #2c8c7c;
            box-shadow: 0 0 0 3px rgba(44,140,124,0.12);
        }
        .list-search::before {
            content: '🔍'; position: absolute;
            right: 10px; top: 50%; transform: translateY(-50%);
            color: #999; font-size: 14px; pointer-events: none;
        }
        .list-search input { padding-right: 34px; }
        .list-empty-search {
            text-align: center; padding: 24px 10px;
            color: #999; font-size: 12px;
        }
        .district-list-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 11px 12px; margin-bottom: 6px;
            background: #f8fbfa; border: 1px solid #e6ecea;
            border-radius: 6px; cursor: pointer;
            transition: all 0.15s ease;
        }
        .district-list-item:hover {
            background: #e8f5f2; border-color: #2c8c7c;
            transform: translateX(-2px);
        }
        .district-list-name {
            font-size: 14px; font-weight: 600; color: #1a1a1a;
        }
        .district-list-stats {
            display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
            min-width: 90px;
        }
        .district-change {
            font-size: 14px; font-weight: bold;
        }
        .district-change.positive { color: #1f6b5e; }
        .district-change.negative { color: #c0392b; }
        .district-price {
            font-size: 11px; color: #777;
        }
        .estimate-tag {
            display: inline-block;
            background: #e0e0e0; color: #666;
            font-size: 9px; font-weight: normal;
            padding: 1px 6px; border-radius: 8px;
            margin-right: 4px; vertical-align: middle;
        }

        /* شريط علوي — خريطة تفاعلية مفعّلة */
        #thematic-topbar {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c8c7c;
            color: white;
            padding: 8px 8px 8px 16px;
            border-radius: 22px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 100;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            max-width: 90%;
            white-space: nowrap;
            pointer-events: auto;
        }
        #thematic-topbar.visible {
            display: inline-flex;
        }
        #thematic-topbar .tb-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #a7f3d0;
            flex-shrink: 0;
            animation: pulse 1.8s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        #thematic-topbar .tb-close {
            background: rgba(255,255,255,0.25);
            color: white;
            border: none;
            width: 26px; height: 26px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            padding: 0;
            line-height: 1;
            flex-shrink: 0;
            touch-action: manipulation;
        }
        #thematic-topbar .tb-close:hover,
        #thematic-topbar .tb-close:active {
            background: rgba(255,255,255,0.4);
        }
        @media (max-width: 767px) {
            #thematic-topbar {
                top: 10px;
                font-size: 12px;
                padding: 6px 6px 6px 14px;
            }
            #thematic-topbar .tb-close {
                width: 24px; height: 24px; font-size: 15px;
            }
        }
        .district-list-item.has-real-data {
            border-right: 3px solid #1f6b5e;
        }
        .district-list-item.estimated {
            background: #fafafa;
        }
        .district-list-item.estimated .district-list-name {
            color: #555;
        }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 7px 14px; margin-bottom: 10px;
            background: white; color: #2c8c7c;
            border: 1px solid #2c8c7c; border-radius: 20px;
            font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.15s;
            font-family: inherit;
        }
        .back-btn:hover {
            background: #2c8c7c; color: white;
        }

        /* بحث برقم الهوية */
        .re-search {
            display: flex; gap: 6px; margin: 6px 0 14px;
        }
        .re-search input {
            flex: 1; padding: 10px 12px;
            border: 1px solid #d0d8d5; border-radius: 6px;
            font-size: 13px; font-family: inherit; direction: ltr; text-align: right;
        }
        .re-search input:focus {
            outline: none; border-color: #2c8c7c;
            box-shadow: 0 0 0 3px rgba(44,140,124,0.15);
        }
        .re-search button {
            padding: 10px 16px; background: #2c8c7c; color: white;
            border: none; border-radius: 6px; cursor: pointer;
            font-size: 13px; font-family: inherit;
        }
        .re-search button:hover { background: #1f6b5e; }
        .re-search button:disabled { background: #bbb; cursor: wait; }

        /* زر الحفظ */
        .save-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; margin: 0 8px 10px 0;
            background: white; color: #e6a82e;
            border: 1px solid #e6a82e; border-radius: 20px;
            font-size: 13px; font-weight: 600;
            cursor: pointer; font-family: inherit;
            transition: all 0.15s;
        }
        .save-btn:hover { background: #e6a82e; color: white; }
        .save-btn.saved { background: #e6a82e; color: white; }
        .save-btn.saved:hover { background: #d4981e; }

        /* قائمة المحفوظات */
        .saved-section { margin-top: 10px; }
        .saved-section h3 {
            font-size: 13px; color: #555; margin: 10px 0 8px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .saved-count { color: #e6a82e; font-weight: bold; }
        .saved-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 12px; margin-bottom: 6px;
            background: #fffbef; border: 1px solid #f0e3b8;
            border-radius: 6px; cursor: pointer; position: relative;
            transition: all 0.15s;
        }
        .saved-item:hover {
            background: #fff4d4; border-color: #e6a82e;
        }
        .saved-item .saved-star { font-size: 18px; color: #e6a82e; margin-left: 8px; }
        .saved-item .saved-info { flex: 1; min-width: 0; }
        .saved-item .saved-title {
            font-size: 13px; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .saved-item .saved-sub {
            font-size: 11px; color: #777; margin-top: 2px;
        }
        .saved-remove {
            background: none; border: none; color: #c0392b;
            cursor: pointer; font-size: 18px; padding: 4px 8px;
            border-radius: 4px;
        }
        .saved-remove:hover { background: #fdecec; }

        .lands-empty-hint {
            padding: 30px 20px; text-align: center; color: #999;
            font-size: 13px;
        }
        .lands-empty-hint .icon { font-size: 40px; margin-bottom: 10px; opacity: 0.4; }

        /* ═══ لوحة الخرائط التفاعلية ═══ */
        .thematic-panel {
            margin-top: 18px;
            background: #f8fbfa;
            border: 1px solid #d8e5e1;
            border-radius: 8px;
            padding: 14px;
            direction: rtl;
        }
        .thematic-panel .t-header {
            display: flex; align-items: baseline; justify-content: space-between;
            margin-bottom: 4px;
        }
        .thematic-panel h3 {
            margin: 0; font-size: 14px; color: #2c8c7c;
            font-weight: 600;
        }
        .thematic-panel .t-intro {
            color: #666; font-size: 11px;
            margin: 0 0 12px; line-height: 1.6;
        }
        .thematic-category {
            margin-bottom: 12px;
        }
        .thematic-category:last-child { margin-bottom: 0; }
        .thematic-category-title {
            font-size: 11px; color: #5a7a72; font-weight: 600;
            margin-bottom: 6px; display: flex; align-items: center; gap: 4px;
        }
        .thematic-buttons {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
        }
        .thematic-btn {
            background: white; color: #2c8c7c;
            border: 1px solid #c5dbd5; border-radius: 5px;
            padding: 8px 4px; font-size: 10.5px;
            font-family: inherit; cursor: pointer;
            text-align: center; line-height: 1.35;
            transition: all 0.12s;
        }
        .thematic-btn:hover {
            background: #e8f5f2; border-color: #2c8c7c;
        }
        .thematic-btn.active {
            background: #2c8c7c; border-color: #2c8c7c;
            color: white; font-weight: 600;
            box-shadow: 0 1px 4px rgba(44,140,124,0.3);
        }
        .thematic-btn.soon {
            opacity: 0.45; cursor: not-allowed;
            background: #f0f0f0; color: #999; border-color: #e0e0e0;
        }
        .thematic-btn.soon::after {
            content: ' · قريباً'; font-size: 8px;
        }

        /* ── أسطورة الخريطة (في اللوحة الجانبية) ── */
        .thematic-legend {
            margin-top: 10px; padding: 10px;
            background: white; border: 1px solid #c5dbd5;
            border-radius: 5px;
        }
        .thematic-legend .tl-title {
            font-weight: 600; color: #1a1a1a; font-size: 12px;
            margin-bottom: 6px;
        }
        .thematic-legend .tl-desc {
            font-size: 11px; color: #666; line-height: 1.6;
            margin-bottom: 8px;
        }
        .thematic-legend .tl-scale {
            height: 10px; border-radius: 2px;
            background: linear-gradient(to left, #fff, #2c8c7c);
            margin-bottom: 4px;
            border: 1px solid #d0d8d5;
        }
        .thematic-legend .tl-scale.diverging {
            background: linear-gradient(to left, #c0392b, #f5f5f5, #1f6b5e);
        }
        .thematic-legend .tl-labels {
            display: flex; justify-content: space-between;
            color: #555; font-size: 10px;
        }

        /* ── شارة تذكير فوق الخريطة (صغيرة) ── */
        .map-legend {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(255,255,255,0.96);
            border: 1px solid #d0d8d5;
            border-radius: 6px; padding: 6px 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-size: 11px; z-index: 5;
            color: #2c8c7c; font-weight: 600;
        }
        .map-legend .close {
            background: none; border: none; cursor: pointer;
            color: #999; font-size: 14px; padding: 0 0 0 6px;
            vertical-align: middle;
        }
        .map-legend .close:hover { color: #c0392b; }
        /* ═══════════════════════════════════════════════════════
           📱 نسخة الجوال — تنشط عند عرض شاشة أقل من 768 بكسل
           ═══════════════════════════════════════════════════════ */
        @media (max-width: 767px) {
            #container {
                flex-direction: column;
                height: 100vh;
                overflow: hidden;
            }

            /* الخريطة دائماً ظاهرة في الأعلى (تملأ كل الشاشة بين الحالة الأولى والتبويبات) */
            #map {
                flex: 1;
                min-height: 0;
                width: 100%;
                position: relative;
            }

            /* الشريط الجانبي يختفي في الحالة الأولى (مكتمل الارتفاع لكن مدفوع للأسفل) */
            #sidebar {
                position: fixed;
                left: 0; right: 0;
                bottom: 48px;
                height: 75vh;
                max-height: 75vh;
                width: 100%;
                background: #fff;
                box-shadow: 0 -4px 16px rgba(0,0,0,0.12);
                z-index: 20;
                transform: translateY(100%);
                transition: transform 0.3s ease, height 0.3s ease;
                display: flex; flex-direction: column;
                border-top-left-radius: 14px;
                border-top-right-radius: 14px;
                will-change: transform;
            }

            /* عند التوسيع: انزلاق من الأسفل */
            #sidebar.expanded {
                transform: translateY(0);
            }

            /* حالة "نصف" لإظهار الخريطة مع اللوحة (للخرائط التفاعلية) */
            #sidebar.half {
                height: 45vh;
                max-height: 45vh;
                transform: translateY(0);
            }
            /* في الوضع النصفي، المحتوى قابل للتمرير داخلياً */
            #sidebar.half .tab-content-wrapper {
                flex: 1;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            /* حالة "مصغّرة" — الرأس الفيروزي فقط ظاهر يدعو للفتح */
            #sidebar.minimized {
                height: 56px;
                max-height: 56px;
                transform: translateY(0);
            }
            #sidebar.minimized .mobile-close-panel {
                cursor: pointer;
            }
            #sidebar.minimized .mobile-close-panel::after {
                /* أيقونة أعلى صغيرة تدعو للفتح */
                content: '▲';
                position: absolute;
                top: 50%; left: 60px;
                transform: translateY(-50%);
                color: rgba(255,255,255,0.8);
                font-size: 11px;
            }
            /* إخفاء زر × في الوضع المصغّر (يستبدل بفتح عند النقر) */
            #sidebar.minimized .close-btn {
                pointer-events: none;
                opacity: 0.5;
            }

            /* على الجوال: ترتيب داخل sidebar (الرأس ثم المحتوى) */
            #sidebar > .mobile-close-panel { order: 1; display: flex; }
            #sidebar > .sidebar-header     { display: none; order: 2; }
            #sidebar > .tab-content-wrapper { order: 3; flex: 1; overflow-y: auto; min-height: 0; }

            /* التبويبات: نُخفيها من داخل sidebar ونستخدم نسخة خارجية دائمة الظهور */
            #sidebar > .tabs { display: none; }

            /* شريط التبويبات الخارجي الثابت — يبقى ظاهراً حتى لو sidebar مختفية */
            #mobile-tabs {
                position: fixed;
                bottom: 0; left: 0; right: 0;
                height: 48px;
                display: flex;
                background: white;
                border-top: 1px solid #e0e0e0;
                z-index: 35;
                box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
            }
            #mobile-tabs .tab {
                flex: 1;
                padding: 8px 4px;
                text-align: center;
                font-size: 12px;
                font-weight: 600;
                background: transparent;
                border: none;
                border-top: 3px solid transparent;
                color: #666;
                cursor: pointer;
                font-family: inherit;
                transition: all 0.15s;
            }
            #mobile-tabs .tab.active {
                color: #2c8c7c;
                border-top-color: #2c8c7c;
                background: #f8fbfa;
            }
            #mobile-tabs .tab:active {
                background: rgba(44,140,124,0.1);
            }

            /* التبويبات (styling مشترك) */
            .tab {
                flex: 1;
                font-size: 12px;
                font-weight: 600;
                border-bottom: none !important;
                border-top: 3px solid transparent;
            }
            .tab.active {
                border-top: 3px solid #2c8c7c !important;
                border-bottom: none !important;
            }

            /* أفسح مكاناً تحت الخريطة للتبويبات */
            #container { padding-bottom: 48px; }

            /* عند فتح اللوحة، رأس اللوحة يحتوي على زر "العودة للخريطة" */
            .mobile-close-panel {
                display: flex; align-items: center; justify-content: space-between;
                padding: 14px 16px;
                background: #2c8c7c;
                color: white;
                font-size: 15px;
                font-weight: 600;
                cursor: grab;
                flex-shrink: 0;
                position: sticky;
                top: 0;
                z-index: 15;
                min-height: 56px;
                box-sizing: border-box;
                border-top-left-radius: 14px;
                border-top-right-radius: 14px;
                touch-action: none;      /* نحن نتحكم بالـ touch */
                user-select: none;
                -webkit-user-select: none;
            }
            .mobile-close-panel:active { cursor: grabbing; }
            .mobile-close-panel .title { display: flex; align-items: center; gap: 8px; font-size: 15px; }
            .mobile-close-panel .close-btn {
                background: rgba(255,255,255,0.25);
                color: white;
                border: none;
                width: 36px; height: 36px;
                border-radius: 50%;
                font-size: 20px;
                font-weight: bold;
                cursor: pointer;
                display: flex; align-items: center; justify-content: center;
                font-family: inherit;
                padding: 0;
                line-height: 1;
                touch-action: manipulation;
            }
            .mobile-close-panel .close-btn:active,
            .mobile-close-panel .close-btn:hover { background: rgba(255,255,255,0.45); }

            /* مقبض السحب أعلى اللوحة (إشارة بصرية) */
            .mobile-close-panel::before {
                content: '';
                position: absolute;
                top: 5px; left: 50%;
                transform: translateX(-50%);
                width: 44px; height: 4px;
                background: rgba(255,255,255,0.55);
                border-radius: 2px;
                pointer-events: none;  /* لا يلتقط الأحداث - تمر للرأس */
            }

            /* طبقة شفافة خلف اللوحة — نقرها يغلق */
            .mobile-backdrop {
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 48px;
                background: rgba(0,0,0,0);
                z-index: 19;
                pointer-events: none;
                transition: background 0.25s ease;
            }
            .mobile-backdrop.visible {
                background: rgba(0,0,0,0.25);
                pointer-events: auto;
            }
            /* في الوضع النصفي: طبقة أخف حتى ترى الخريطة بوضوح */
            .mobile-backdrop.half-mode {
                background: rgba(0,0,0,0);
                pointer-events: none;
            }

            /* إخفاء رأس اللوحة الأصلي (نستبدله بـ mobile-close-panel) */
            .sidebar-header { display: none; }

            /* محتوى تبويبات يملأ الباقي مع تمرير */
            .tab-content-wrapper {
                flex: 1;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
            .tab-content { padding: 12px 14px; }

            /* KPIs على الجوال */
            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }
            .kpi-card { padding: 8px; }
            .kpi-value { font-size: 16px; }
            .kpi-label { font-size: 10px; }

            /* خرائط تفاعلية */
            .thematic-buttons { grid-template-columns: repeat(2, 1fr); }

            /* الرسوم البيانية */
            .chart-container { height: 180px; }

            /* الليجيند */
            .map-legend { bottom: 10px; left: 10px; font-size: 10px; padding: 5px 8px; }
            .mode-badge { font-size: 10px; padding: 4px 10px; top: 8px; right: 8px; }

            /* إخفاء عناصر غير ضرورية على الجوال */
            .hint { display: none; }

            /* زر العودة للخريطة العائم (بديل لو أغلق المستخدم) */
            .mobile-fab-map {
                position: fixed;
                bottom: 60px; right: 14px;
                background: #2c8c7c;
                color: white;
                border: none;
                width: 48px; height: 48px;
                border-radius: 50%;
                font-size: 20px;
                cursor: pointer;
                z-index: 25;
                box-shadow: 0 4px 12px rgba(44,140,124,0.4);
                display: none;
            }
            #sidebar.expanded ~ .mobile-fab-map { display: none; }
        }

        /* شاشات ضيقة جداً */
        @media (max-width: 379px) {
            .tab { font-size: 11px; }
            #sidebar { bottom: 44px; }
            .tabs { height: 44px; }
            #container { padding-bottom: 44px; }
        }

        /* إخفاء زر الجوال والعائم على الديسكتوب */
        .mobile-close-panel, .mobile-fab-map { display: none; }
        @media (max-width: 767px) {
            .mobile-close-panel { display: flex; }
        }
        /* زر المشاركة في الديسكتوب (رأس الشريط الجانبي) */
        .desktop-share-btn {
            position: absolute;
            top: 16px; left: 16px;
            background: rgba(255,255,255,0.22);
            color: white;
            border: none;
            width: 34px; height: 34px;
            border-radius: 50%;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .desktop-share-btn:hover { background: rgba(255,255,255,0.38); }
        .sidebar-header.empty .desktop-share-btn {
            background: #f0f0f0;
            color: #2c8c7c;
            border: 1px solid #ddd;
        }
        .sidebar-header.empty .desktop-share-btn:hover {
            background: #e0f0ec;
        }

        /* نافذة المشاركة (Modal) */
        .share-modal-backdrop {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 200;
            display: flex; align-items: center; justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .share-modal {
            background: white;
            border-radius: 14px;
            padding: 20px 22px;
            width: 90%;
            max-width: 440px;
            direction: rtl;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .share-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 4px;
        }
        .share-header h3 { margin: 0; color: #2c8c7c; font-size: 16px; }
        .share-close {
            background: #f0f0f0; border: none;
            width: 30px; height: 30px; border-radius: 50%;
            font-size: 18px; cursor: pointer;
            color: #666; line-height: 1;
            font-family: inherit;
        }
        .share-close:hover { background: #e0e0e0; color: #333; }
        .share-subtitle {
            color: #666; margin: 6px 0 14px;
            font-size: 13px;
        }
        .share-url-row {
            display: flex; gap: 6px; margin-bottom: 16px;
        }
        .share-url-input {
            flex: 1; min-width: 0;
            padding: 9px 10px;
            border: 1px solid #d0d8d5;
            border-radius: 6px;
            font-size: 11px;
            direction: ltr;
            text-align: left;
            background: #f8fbfa;
            color: #333;
            font-family: monospace;
        }
        .share-url-input:focus {
            outline: none; border-color: #2c8c7c;
        }
        .share-copy-btn {
            background: #2c8c7c; color: white;
            border: none;
            padding: 9px 14px; border-radius: 6px;
            cursor: pointer;
            font-family: inherit; font-size: 12px;
            white-space: nowrap;
            font-weight: 600;
            transition: background 0.15s;
        }
        .share-copy-btn:hover { background: #1f6b5e; }
        .share-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .share-opt {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 6px;
            padding: 12px 6px;
            border: 1px solid #e6ecea;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.15s;
            background: white;
        }
        .share-opt:hover {
            background: #f8fbfa;
            border-color: #2c8c7c;
            transform: translateY(-2px);
            box-shadow: 0 3px 8px rgba(44,140,124,0.15);
        }
        .share-icon { font-size: 22px; }
        .share-native-btn {
            margin-top: 14px; width: 100%;
            padding: 11px;
            background: #2c8c7c; color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.15s;
        }
        .share-native-btn:hover { background: #1f6b5e; }

        /* على الجوال: اجعل النافذة تستفيد من المساحة */
        @media (max-width: 767px) {
            .share-modal {
                width: 94%;
                padding: 18px 16px;
                border-radius: 12px;
            }
            .share-url-input { font-size: 10px; padding: 8px; }
            .share-copy-btn { padding: 8px 10px; font-size: 11px; }
            .share-options { gap: 6px; }
            .share-opt { padding: 10px 4px; font-size: 10px; }
            .share-icon { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <!-- رأس الجوال — العنوان + زر المشاركة + زر الإغلاق (يظهر فقط على الجوال) -->
            <div class="mobile-close-panel" id="mobile-close-panel">
                <div class="title">
                    <span id="mobile-panel-title">التفاصيل</span>
                </div>
                <div style="display:flex; gap:6px; align-items:center">
                    <button class="close-btn share-btn-header" onclick="openShareSheet(); event.stopPropagation();" title="مشاركة">🔗</button>
                    <button class="close-btn" onclick="collapseMobilePanel(); event.stopPropagation();" title="إغلاق والعودة للخريطة">×</button>
                </div>
            </div>

            <!-- رأس الديسكتوب -->
            <div class="sidebar-header empty" id="sidebar-header">
                <button class="desktop-share-btn" onclick="openShareSheet()" title="مشاركة الرابط">🔗</button>
                <h2 id="sb-title">اختر قطعة أو حي من الخريطة</h2>
                <p id="sb-subtitle">اضغط على أي موقع لعرض بياناته</p>
                <span class="source-badge" id="sb-source" style="display:none"></span>
            </div>

            <!-- محتوى التبويبات قابل للتمرير -->
            <div class="tab-content-wrapper">
                <div class="tab-content active" id="tab-lands">
                    <div class="empty-state">
                        <div class="icon">🗺️</div>
                        <div class="msg">لا توجد قطعة محددة</div>
                        <div class="hint-text">اضغط على أي قطعة في الخريطة</div>
                    </div>
                </div>
                <div class="tab-content" id="tab-districts">
                    <div class="empty-state">
                        <div class="icon">🏘️</div>
                        <div class="msg">اضغط على حي في الخريطة</div>
                        <div class="hint-text">حدود الأحياء تظهر عند تصغير التكبير</div>
                    </div>
                </div>
                <div class="tab-content" id="tab-city">
                    <div class="empty-state">
                        <div class="icon">🏙️</div>
                        <div class="msg">بيانات المدينة</div>
                        <div class="hint-text">اضغط على أي موقع</div>
                    </div>
                </div>
            </div>

            <!-- شريط التبويبات: في الأسفل دائماً على الجوال، أعلى اللوحة على الديسكتوب -->
            <div class="tabs">
                <button class="tab active" data-tab="lands"     onclick="switchTab('lands')">🏠 الأراضي</button>
                <button class="tab"        data-tab="districts" onclick="switchTab('districts')">🏘️ الأحياء</button>
                <button class="tab"        data-tab="city"      onclick="switchTab('city')">🏙️ المدينة</button>
            </div>
        </div>

        <div id="map">
            <div class="mode-badge" id="mode-badge">وضع: الأراضي</div>
            <div class="hint" id="hint">اضغط على أي قطعة أو حي</div>
            <div class="map-legend" id="map-legend" style="display:none"></div>
        </div>
        <div class="mobile-backdrop" id="mobile-backdrop" onclick="collapseMobilePanel()"></div>

        <!-- الشريط العلوي للخريطة التفاعلية — خارج كل الحاويات للظهور فوق كل شيء -->
        <div id="thematic-topbar">
            <span class="tb-dot"></span>
            <span id="thematic-topbar-label">—</span>
            <button class="tb-close" onclick="clearThematicMap()" title="إيقاف الخريطة التفاعلية">×</button>
        </div>

        <!-- شريط تبويبات ثابت للجوال — خارج sidebar حتى لا يتأثر بـ transform -->
        <div id="mobile-tabs">
            <button class="tab active" data-mtab="lands"     onclick="switchTab('lands')">🏠 الأراضي</button>
            <button class="tab"        data-mtab="districts" onclick="switchTab('districts')">🏘️ الأحياء</button>
            <button class="tab"        data-mtab="city"      onclick="switchTab('city')">🏙️ المدينة</button>
        </div>
    </div>

    <script>
        const PROXY_URL = 'https://balady-proxy.almoiad-alkadam.workers.dev';

        /* Map ID مطلوب لإظهار حدود الأحياء.
           DEMO_MAP_ID للاختبار. أنشئ Map ID خاص بك من:
           Google Cloud Console → Map Management → Create Map ID
           (نوع: JavaScript، Vector، مع تفعيل Data-driven styling) */
        const MAP_ID = 'fe5bb36f745305930c630843';

        let map, currentPolygon = null, currentMarker = null;
        let districtLayer = null;
        let selectedDistrictPlaceId = null;
        let hoveredPlaceId = null;
        let lastData = null;
        let activeTab = 'lands';
        let chartInstances = [];
        let lastFeatureClick = 0;

        const LAND_USE_MAIN = {
            '100000': 'سكني', '200000': 'تجاري', '300000': 'صناعي',
            '400000': 'زراعي', '500000': 'خدمات', '600000': 'ترفيهي',
            '700000': 'ديني', '800000': 'حكومي', '900000': 'شوارع ومرافق',
        };
        const LAND_USE_DETAIL = {
            '101000': 'سكني عام', '101011': 'عمارة سكنية', '101012': 'فيلا',
            '101013': 'دوبلكس', '101014': 'شقة', '101015': 'بيت شعبي', '101016': 'استراحة',
            '201000': 'تجاري عام', '201011': 'محل تجاري', '201012': 'مجمع تجاري',
        };
        const PARCEL_STATUS = { '1': 'دائم', '2': 'مؤقت', '3': 'قيد المراجعة' };

        /* ═══════ تبديل التبويبات ═══════ */
        /* ═══════ نسخة الجوال — إدارة توسيع اللوحة ═══════ */
        function isMobile() {
            return window.matchMedia('(max-width: 767px)').matches;
        }
        function setMobilePanelTitle(text) {
            const el = document.getElementById('mobile-panel-title');
            if (el) el.textContent = text || 'التفاصيل';
        }
        function expandMobilePanel(title) {
            if (!isMobile()) return;
            const sb = document.getElementById('sidebar');
            sb.classList.remove('half', 'minimized');
            if (!sb.classList.contains('expanded')) {
                sb.classList.add('expanded');
            }
            const bd = document.getElementById('mobile-backdrop');
            if (bd) {
                bd.classList.add('visible');
                bd.classList.remove('half-mode');
            }
            if (title) setMobilePanelTitle(title);
        }
        function halfMobilePanel(title) {
            // وضع نصف الشاشة — يعرض اللوحة والخريطة معاً
            if (!isMobile()) return;
            const sb = document.getElementById('sidebar');
            sb.classList.remove('expanded', 'minimized');
            sb.classList.add('half');
            const bd = document.getElementById('mobile-backdrop');
            if (bd) {
                bd.classList.add('visible', 'half-mode');
            }
            if (title) setMobilePanelTitle(title);
        }
        function minimizeMobilePanel(title) {
            // وضع "مصغّر" — الرأس فقط يبقى، الخريطة مكشوفة تماماً
            if (!isMobile()) return;
            const sb = document.getElementById('sidebar');
            sb.classList.remove('expanded', 'half');
            sb.classList.add('minimized');
            const bd = document.getElementById('mobile-backdrop');
            if (bd) bd.classList.remove('visible', 'half-mode');
            if (title) setMobilePanelTitle(title);
        }
        function collapseMobilePanel() {
            if (!isMobile()) return;
            const sb = document.getElementById('sidebar');
            // إذا في وضع موسّع أو نصفي، اذهب للمصغّر (الرأس فقط)
            // فقط إذا كانت حالة فعلية (مدينة مختارة أو حي محدد)
            const hasDetails = lastData?.district || lastData?.selectedCity || lastData?.selected;
            if (hasDetails && (sb.classList.contains('expanded') || sb.classList.contains('half'))) {
                const title = lastData?.district?.name
                    || (lastData?.selectedCity ? (CITY_NAMES_AR[lastData.selectedCity] || lastData.selectedCity) : null)
                    || 'التفاصيل';
                minimizeMobilePanel(title);
            } else {
                // لا شيء محدد، أغلق بالكامل
                sb.classList.remove('expanded', 'half', 'minimized');
                const bd = document.getElementById('mobile-backdrop');
                if (bd) bd.classList.remove('visible', 'half-mode');
            }
        }
        // إغلاق نهائي — يُنفّذ عند تغيير المدينة أو العودة للقائمة
        function fullyCloseMobilePanel() {
            if (!isMobile()) return;
            const sb = document.getElementById('sidebar');
            sb.classList.remove('expanded', 'half', 'minimized');
            const bd = document.getElementById('mobile-backdrop');
            if (bd) bd.classList.remove('visible', 'half-mode');
        }
        function mobileTitleForTab(name) {
            return { lands: 'الأراضي', districts: 'الأحياء', city: 'المدينة' }[name] || 'التفاصيل';
        }

        /* ═══════ السحب للأسفل لإغلاق اللوحة ═══════ */
        function setupSwipeToClose() {
            const header = document.getElementById('mobile-close-panel');
            if (!header) return;
            const sb = document.getElementById('sidebar');
            let startY = 0, currentY = 0, dragging = false;

            const getY = e => (e.touches && e.touches[0]) ? e.touches[0].clientY
                            : (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientY
                            : e.clientY;

            const onStart = e => {
                if (!isMobile()) return;
                const target = e.target;
                if (target && (target.closest('button') || target.tagName === 'BUTTON')) return;
                startY = getY(e);
                currentY = startY;
                dragging = true;
                sb.style.transition = 'none';
            };
            const onMove = e => {
                if (!dragging) return;
                currentY = getY(e);
                const dy = Math.max(0, currentY - startY);
                sb.style.transform = `translateY(${dy}px)`;
                if (dy > 10 && e.cancelable) {
                    e.preventDefault();
                }
            };
            const onEnd = e => {
                if (!dragging) return;
                dragging = false;
                sb.style.transition = '';
                const dy = currentY - startY;
                sb.style.transform = '';
                if (dy > 80) {
                    collapseMobilePanel();
                } else if (dy < 5) {
                    // كانت نقرة فقط (لا سحب فعلي)
                    // إذا اللوحة مصغّرة، وسّعها
                    if (sb.classList.contains('minimized')) {
                        const target = e && e.target;
                        // تجنب التوسيع لو نُقر على زر
                        if (!(target && target.closest('button'))) {
                            const title = document.getElementById('mobile-panel-title')?.textContent;
                            expandMobilePanel(title);
                        }
                    }
                }
            };
            header.addEventListener('touchstart', onStart, { passive: true });
            header.addEventListener('touchmove', onMove, { passive: false });
            header.addEventListener('touchend', onEnd);
            header.addEventListener('touchcancel', onEnd);
            // نقرة على الرأس في وضع مصغّر (للفأرة)
            header.addEventListener('click', e => {
                if (!isMobile()) return;
                if (e.target && e.target.closest('button')) return;
                if (sb.classList.contains('minimized')) {
                    const title = document.getElementById('mobile-panel-title')?.textContent;
                    expandMobilePanel(title);
                }
            });
        }

        function switchTab(name) {
            console.log(`→ switchTab('${name}'), activeTab=${activeTab}, lastData:`, {
                selectedCity: lastData?.selectedCity,
                district: lastData?.district?.name,
                selected: !!lastData?.selected,
            });

            // الجوال: إذا اللوحة مغلقة، افتحها — حتى لو كان التبويب مطابقاً
            if (isMobile()) {
                const sb = document.getElementById('sidebar');
                const isCollapsed = !sb.classList.contains('expanded');
                if (isCollapsed) {
                    // افتح اللوحة على هذا التبويب بدون تبديل منطقي
                    if (activeTab !== name) {
                        activeTab = name;
                        document.querySelectorAll('.tab').forEach(t =>
                            t.classList.toggle('active',
                                t.dataset.tab === name || t.dataset.mtab === name));
                        document.querySelectorAll('.tab-content').forEach(c =>
                            c.classList.toggle('active', c.id === `tab-${name}`));
                        updateZoomBadge();
                        if (map && map.data) {
                            if (activeThematicKey) renderThematicMap();
                            else map.data.setStyle(styleDistrictFeature);
                        }
                        if (name === 'districts') setTimeout(() => renderDistrictTab(lastData || {}), 50);
                        else if (name === 'city') setTimeout(() => renderCityTab(lastData || {}), 50);
                    }
                    expandMobilePanel(mobileTitleForTab(name));
                    return;
                }
            }

            // الضغط على نفس التبويب النشط = العودة إلى القائمة إذا كنا في تفاصيل
            if (activeTab === name) {
                if (name === 'districts' && lastData?.district) {
                    console.log('  → returning to districts list');
                    backToDistrictsList();
                    return;
                }
                if (name === 'city' && lastData?.selectedCity) {
                    console.log('  → returning to cities list');
                    backToCitiesList();
                    return;
                }
                if (name === 'lands' && lastData?.selected) {
                    console.log('  → returning to lands home');
                    backToLandsHome();
                    return;
                }
                console.log('  → already on list, no-op');
                return;
            }

            activeTab = name;
            document.querySelectorAll('.tab').forEach(t =>
                t.classList.toggle('active',
                    t.dataset.tab === name || t.dataset.mtab === name));
            document.querySelectorAll('.tab-content').forEach(c =>
                c.classList.toggle('active', c.id === `tab-${name}`));

            updateZoomBadge();

            if (map && map.data) {
                // احتفظ بألوان الخريطة التفاعلية إن كانت نشطة
                if (activeThematicKey) {
                    renderThematicMap();
                } else {
                    map.data.setStyle(styleDistrictFeature);
                }
            }

            // على الجوال: النقر على تبويب يوسّع اللوحة
            expandMobilePanel(mobileTitleForTab(name));

            if (name === 'districts') {
                setTimeout(() => renderDistrictTab(lastData || {}), 50);
            } else if (name === 'city') {
                setTimeout(() => renderCityTab(lastData || {}), 50);
            }
        }

        /* ═══════ تهيئة الخريطة ═══════ */
        async function initMap() {
            // تحميل المكتبات المطلوبة ديناميكياً — نستخرج FeatureType من مكتبة maps
            const mapsLib   = await google.maps.importLibrary("maps");
            const markerLib = await google.maps.importLibrary("marker");
            const placesLib = await google.maps.importLibrary("places");
            const { Map, FeatureType } = mapsLib;
            window.PlaceClass = placesLib.Place;

            const mobile = window.matchMedia('(max-width: 767px)').matches;
            map = new Map(document.getElementById("map"), {
                mapId: MAP_ID,
                center: { lat: 24.7136, lng: 46.6753 },
                zoom: mobile ? 10 : 11, // على الجوال ابدأ بمنظر أوسع للمدينة
                mapTypeId: 'roadmap',
                mapTypeControl: !mobile,        // على الجوال: أخفِ
                streetViewControl: false,
                fullscreenControl: !mobile,     // على الجوال: أخفِ
                zoomControl: true,
                gestureHandling: mobile ? 'greedy' : 'auto', // الجوال: إصبع واحد للتحريك
            });

            // تحميل حدود الأحياء من OpenStreetMap
            // (Google لا يدعم sublocality في Data-driven Styling)
            loadRiyadhDistricts();

            map.addListener('click', onMapClick);
            map.addListener('zoom_changed', () => {
                updateZoomBadge();
                if (!map.data) return;
                hoveredDistrictId = null;
                map.data.revertStyle();
                // إذا خريطة تفاعلية نشطة، طبّقها (تحلّ محلّ setStyle الافتراضي)
                if (activeThematicKey) {
                    renderThematicMap();
                } else {
                    map.data.setStyle(styleDistrictFeature);
                    if (selectedDistrictId) {
                        map.data.forEach(f => {
                            if (f.getId() === selectedDistrictId) {
                                map.data.overrideStyle(f, styleDistrictFeature(f));
                            }
                        });
                    }
                }
            });
            // تحديث قائمة الأحياء فقط عند تغيّر المدينة (لا عند أي تحريك)
            let boundsTimer = null;
            let lastListCity = null;
            map.addListener('bounds_changed', () => {
                if (boundsTimer) clearTimeout(boundsTimer);
                boundsTimer = setTimeout(() => {
                    if (activeTab !== 'districts' || selectedDistrictId || !osmDistrictsLoaded) return;
                    const currentCity = getCurrentMapCity();
                    if (currentCity !== lastListCity) {
                        lastListCity = currentCity;
                        renderDistrictsList();
                    }
                }, 400);
            });
            updateZoomBadge();

            // ارسم النجمات للقطع المحفوظة + الحالة الفارغة للأراضي
            renderSavedMarkers();
            renderLandsEmpty();

            // اطبع حالة URL فوراً لو كان parcel فقط (لا يحتاج أحياء)
            const urlParams = getURLParams();
            if (urlParams.parcel && !urlParams.city && !urlParams.district) {
                console.log('🔗 تطبيق رابط قطعة مباشرة (لا ينتظر الأحياء)');
                applyURLState().catch(err => console.warn('applyURLState (parcel) failed:', err));
            }
        }

        function updateZoomBadge() {
            if (!map) return;
            const zoom = map.getZoom();
            const clickMode = zoom >= 15 ? 'القطعة' : 'الحي';
            const badge = document.getElementById('mode-badge');
            if (badge) {
                const tabLabels = { lands: 'الأراضي', districts: 'الأحياء', city: 'المدينة' };
                badge.textContent = `تبويب: ${tabLabels[activeTab]} | نقرة → ${clickMode} (z=${zoom})`;
            }
        }

        /* ═══════ تحميل حدود الأحياء: مدمج > Worker > ملف محلي ═══════ */
        let osmDistrictsLoaded = false;
        async function loadRiyadhDistricts() {
            let geojson = null;
            let source = '';

            // ١) بيانات مدمجة من embedded_districts.js (فورية، لا شبكة)
            if (window.EMBEDDED_DISTRICTS && window.EMBEDDED_DISTRICTS.features) {
                geojson = window.EMBEDDED_DISTRICTS;
                source = 'embedded';
            }

            // ٢) Worker (عند عدم وجود المدمج)
            if (!geojson) {
                showWarn('⏳ جارٍ تحميل حدود الأحياء من Worker...', 60000);
                try {
                    const res = await fetch(`${PROXY_URL}/districts`);
                    if (res.ok) {
                        const data = await res.json();
                        if (!data.error && data.features && data.features.length > 0) {
                            geojson = data;
                            source = data._cached || 'worker';
                        }
                    }
                } catch (err) {}
            }

            // ٣) ملف محلي districts.geojson
            if (!geojson) {
                try {
                    const res = await fetch('districts.geojson');
                    if (res.ok) {
                        geojson = await res.json();
                        source = 'local file';
                    }
                } catch (err) {}
            }

            document.querySelectorAll('.warn').forEach(e => e.remove());

            if (!geojson || !geojson.features) {
                showWarn('تعذر تحميل حدود الأحياء. استخدم osm_converter.html لإنشاء embedded_districts.js');
                return;
            }

            // تصفية: الأحياء فقط بأسماء حقيقية (استبعاد قطع/مخططات بلا اسم)
            const before = geojson.features.length;
            geojson.features = geojson.features.filter(f => {
                const p = f.properties || {};
                const name = p['name:ar'] || p.name;
                return name && name.trim().length > 2;
            });
            const after = geojson.features.length;
            if (before !== after) console.log(`↓ استُبعد ${before - after} عنصر بلا اسم`);

            map.data.addGeoJson(geojson);
            map.data.setStyle(styleDistrictFeature);
            map.data.addListener('click',     onDistrictClick);
            map.data.addListener('mouseover', onDistrictHover);
            map.data.addListener('mouseout',  onDistrictHoverEnd);

            osmDistrictsLoaded = true;
            rescanLoadedCities();
            console.log(`✓ حُمّل ${geojson.features.length} حياً (${source})`);
            console.log(`✓ المدن المحمّلة: ${[...loadedCities].join(', ') || 'لا شيء'}`);

            // طبّق حالة URL إذا وُجدت (deep linking)
            applyURLState().catch(err => console.warn('applyURLState failed:', err));
        }

        /* ═══════════════════════════════════════════════════════
           🔗 نظام الروابط المباشرة (Deep Linking)
           ═══════════════════════════════════════════════════════
           ?city=riyadh          → يفتح مدينة
           ?district=الملقا       → يفتح حياً (مع city إن وُجد)
           ?parcel=RE_PARCELID   → يفتح قطعة محددة
           ?thematic=price       → يفعّل خريطة تفاعلية
        */

        function getURLParams() {
            const p = new URLSearchParams(window.location.search);
            return {
                city: p.get('city'),
                district: p.get('district'),
                parcel: p.get('parcel'),
                thematic: p.get('thematic'),
            };
        }

        function updateURL(state) {
            // state مطلوب ويحدد بالضبط المعلمات النهائية.
            // أي مفتاح غير موجود أو null سيُحذف من URL.
            // استخدم state.auto = true إذا كنت تريد قراءة الحالة من lastData تلقائياً.
            if (!state) state = {};

            let city, district, parcel, thematic;

            if (state.auto) {
                // الوضع التلقائي: اقرأ الحالة الفعلية من lastData
                // لكن بقواعد حصرية: القطعة تُستبعد وجود حي/مدينة،
                // والمدينة/الحي يستبعدا وجود القطعة
                if (lastData?.selected?.attributes?.RE_PARCELID) {
                    parcel = lastData.selected.attributes.RE_PARCELID;
                } else {
                    city = lastData?.selectedCity || null;
                    district = lastData?.district?.name || null;
                    thematic = activeThematicKey || null;
                }
            } else {
                city = state.city || null;
                district = state.district || null;
                parcel = state.parcel || null;
                thematic = state.thematic || null;
            }

            const p = new URLSearchParams();
            if (city)     p.set('city', city);
            if (district) p.set('district', district);
            if (parcel)   p.set('parcel', parcel);
            if (thematic) p.set('thematic', thematic);

            const query = p.toString();
            const newURL = window.location.pathname + (query ? '?' + query : '');
            history.replaceState(null, '', newURL);
        }

        // بعد تهيئة الخريطة وتحميل البيانات، طبّق حالة URL
        async function applyURLState() {
            const params = getURLParams();
            if (!params.city && !params.district && !params.parcel) return;

            console.log('🔗 تطبيق حالة URL:', params);

            // القطعة لها الأولوية — تفتح مباشرة (لا تحتاج أحياء)
            if (params.parcel) {
                console.log('🔗 محاولة فتح القطعة:', params.parcel);
                try {
                    const url = `${PROXY_URL}/search?re_id=${encodeURIComponent(params.parcel)}`;
                    console.log('🔗 URL:', url);
                    const res = await fetch(url);
                    const data = await res.json();
                    console.log('🔗 استجابة Worker:', data);
                    if (data.features && data.features.length > 0) {
                        const f = data.features[0];
                        if (f.geometry && f.geometry.rings && f.geometry.rings.length > 0) {
                            const ring = f.geometry.rings[0];
                            const cx = ring.reduce((s, p) => s + p[0], 0) / ring.length;
                            const cy = ring.reduce((s, p) => s + p[1], 0) / ring.length;
                            console.log('🔗 مركز القطعة:', { lat: cy, lng: cx });
                            map.panTo({ lat: cy, lng: cx });
                            map.setZoom(18);
                            // انتقل لتبويب الأراضي
                            activeTab = 'lands';
                            document.querySelectorAll('.tab').forEach(t =>
                                t.classList.toggle('active',
                                    t.dataset.tab === 'lands' || t.dataset.mtab === 'lands'));
                            document.querySelectorAll('.tab-content').forEach(c =>
                                c.classList.toggle('active', c.id === 'tab-lands'));
                            // استدع fetchParcel (ستفتح اللوحة تلقائياً على الجوال)
                            await fetchParcel(cy, cx);
                            return;
                        } else {
                            console.warn('🔗 القطعة لا تحتوي على إحداثيات');
                            showWarn('القطعة موجودة لكن بدون إحداثيات', 5000);
                        }
                    } else {
                        console.warn('🔗 لم يُرجع Worker أي features');
                        showWarn('رقم الهوية العقارية غير موجود', 5000);
                    }
                } catch (err) {
                    console.error('🔗 فشل فتح القطعة من URL:', err);
                    showWarn('تعذّر جلب القطعة — ' + err.message, 5000);
                }
                return; // لا تطبّق city/district إذا طُلبت قطعة
            }

            // مدينة
            if (params.city && CITY_BBOX[params.city]) {
                // انتقل أولاً لتبويب المدينة قبل الاختيار
                activeTab = 'city';
                document.querySelectorAll('.tab').forEach(t =>
                    t.classList.toggle('active',
                        t.dataset.tab === 'city' || t.dataset.mtab === 'city'));
                document.querySelectorAll('.tab-content').forEach(c =>
                    c.classList.toggle('active', c.id === 'tab-city'));

                await selectCityFromList(params.city);

                // خريطة تفاعلية على مستوى المدينة
                if (params.thematic && THEMATIC_METRICS[params.thematic]?.real) {
                    // انتظر قليلاً حتى تتحمّل الصفقات
                    setTimeout(() => applyThematicMap(params.thematic), 800);
                }
            }

            // حي (قد يأتي بدون city)
            if (params.district) {
                // انتقل لتبويب الأحياء
                activeTab = 'districts';
                document.querySelectorAll('.tab').forEach(t =>
                    t.classList.toggle('active',
                        t.dataset.tab === 'districts' || t.dataset.mtab === 'districts'));
                document.querySelectorAll('.tab-content').forEach(c =>
                    c.classList.toggle('active', c.id === 'tab-districts'));

                // انتظر تحميل الأحياء ثم ابحث عن الحي بالاسم
                setTimeout(() => {
                    const targetName = normalizeDistrictName(params.district);
                    let found = null;
                    map.data.forEach(f => {
                        if (found) return;
                        const name = f.getProperty('name:ar') || f.getProperty('name');
                        if (name && normalizeDistrictName(name) === targetName) {
                            found = f;
                        }
                    });
                    if (found) {
                        selectDistrictFromList({
                            id: found.getId(),
                            name: found.getProperty('name:ar') || found.getProperty('name'),
                            feature: found,
                            stats: getDistrictStats(found.getId(),
                                found.getProperty('name:ar') || found.getProperty('name'),
                                getCurrentMapCity()),
                        });
                    } else {
                        showWarn(`الحي "${params.district}" غير موجود`, 4000);
                    }
                }, 1200);
            }
        }

        /* ═══════ مشاركة الرابط ═══════ */
        function getCurrentShareableURL() {
            // بني URL من حالة التطبيق الحالية بقواعد حصرية
            const state = {};
            const parcelId = lastData?.selected?.attributes?.RE_PARCELID;
            if (parcelId) {
                // القطعة لها الأولوية — تجاهل المدينة والحي
                state.parcel = parcelId;
            } else {
                if (lastData?.selectedCity) state.city = lastData.selectedCity;
                if (lastData?.district?.name) state.district = lastData.district.name;
                if (activeThematicKey) state.thematic = activeThematicKey;
            }

            const p = new URLSearchParams();
            for (const [k, v] of Object.entries(state)) p.set(k, v);
            const base = window.location.origin + window.location.pathname;
            return base + '?' + p.toString();
        }

        function openShareSheet() {
            const url = getCurrentShareableURL();
            const title = buildShareTitle();
            showShareModal(url, title);
        }

        function buildShareTitle() {
            const parcelId = lastData?.selected?.attributes?.RE_PARCELID;
            if (parcelId) {
                return `قطعة: ${parcelId}`;
            }
            if (lastData?.district?.name) {
                return `حي ${lastData.district.name}`;
            }
            if (lastData?.selectedCity) {
                return `مدينة ${CITY_NAMES_AR[lastData.selectedCity] || lastData.selectedCity}`;
            }
            return 'عقار وعُمار — خريطة العقارات السعودية';
        }

        function showShareModal(url, title) {
            // أزل أي modal قديم
            document.querySelectorAll('.share-modal-backdrop').forEach(n => n.remove());

            const backdrop = document.createElement('div');
            backdrop.className = 'share-modal-backdrop';
            backdrop.onclick = e => { if (e.target === backdrop) backdrop.remove(); };

            const text = encodeURIComponent(`${title}\n${url}`);
            const encodedUrl = encodeURIComponent(url);

            backdrop.innerHTML = `
                <div class="share-modal">
                    <div class="share-header">
                        <h3>مشاركة</h3>
                        <button class="share-close" onclick="this.closest('.share-modal-backdrop').remove()">×</button>
                    </div>
                    <div class="share-subtitle">${escapeHtml(title)}</div>
                    <div class="share-url-row">
                        <input class="share-url-input" value="${escapeHtml(url)}" readonly onclick="this.select()" />
                        <button class="share-copy-btn" onclick="copyShareURL(this, '${escapeHtml(url)}')">📋 نسخ</button>
                    </div>
                    <div class="share-options">
                        <a class="share-opt wa" href="https://wa.me/?text=${text}" target="_blank" rel="noopener">
                            <span class="share-icon">💬</span>
                            <span>واتساب</span>
                        </a>
                        <a class="share-opt tg" href="https://t.me/share/url?url=${encodedUrl}&text=${encodeURIComponent(title)}" target="_blank" rel="noopener">
                            <span class="share-icon">✈️</span>
                            <span>تلغرام</span>
                        </a>
                        <a class="share-opt tw" href="https://twitter.com/intent/tweet?text=${text}" target="_blank" rel="noopener">
                            <span class="share-icon">𝕏</span>
                            <span>تويتر</span>
                        </a>
                        <a class="share-opt mail" href="mailto:?subject=${encodeURIComponent(title)}&body=${text}">
                            <span class="share-icon">✉️</span>
                            <span>بريد</span>
                        </a>
                    </div>
                </div>
            `;
            document.body.appendChild(backdrop);

            // إذا كان Web Share API مدعوماً (خصوصاً على iOS/Android)، أضف زراً للمشاركة الأصلية
            if (navigator.share) {
                const nativeBtn = document.createElement('button');
                nativeBtn.className = 'share-native-btn';
                nativeBtn.innerHTML = '📱 مشاركة عبر التطبيقات';
                nativeBtn.onclick = async () => {
                    try {
                        await navigator.share({ title, url, text: title });
